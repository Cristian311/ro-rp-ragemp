<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>Poker HUD – RageMP</title>
</head>

<body>

<div id="topbar">
  <div class="logo">♠ POKER HUD</div>
  <div class="sep"></div>
  <div class="info" id="phase-label">PRE-FLOP</div>
  <div class="info" style="margin-left:20px">RageMP v1.1</div>
</div>

<div id="pot-display">POT: $<span id="pot-value">0</span></div>

<div id="player-hand">
  <div class="label">Cărțile tale</div>
  <div class="cards" id="hand-cards">
    <div class="card back" id="pc1"></div>
    <div class="card back" id="pc2"></div>
  </div>
</div>

<div id="community">
  <div class="label">Masă</div>
  <div class="cards" id="community-cards">
    <div class="card back" id="cc1" style="display:none"></div>
    <div class="card back" id="cc2" style="display:none"></div>
    <div class="card back" id="cc3" style="display:none"></div>
    <div class="card back" id="cc4" style="display:none"></div>
    <div class="card back" id="cc5" style="display:none"></div>
  </div>
</div>

<div id="actions">
  <button class="btn-action" id="btn-fold"  onclick="sendAction('fold')">Fold</button>
  <button class="btn-action" id="btn-check" onclick="sendAction('check')">Check</button>
  <button class="btn-action" id="btn-call"  onclick="sendAction('call')">Call</button>
  <button class="btn-action" id="btn-raise" onclick="sendAction('raise')">Raise</button>
  <button class="btn-action" id="btn-allin" onclick="sendAction('allin')">All-In</button>
</div>

<div id="player-list">
  <div class="pl-header">
    <span>Jucători</span>
    <span class="pot" id="blind-info">BB $20 / SB $10</span>
  </div>
  <div id="pl-rows">
    </div>
</div>

<div id="timer-wrap">
  <div id="timer-ring">
    <svg width="60" height="60" viewBox="0 0 60 60">
      <circle id="track" cx="30" cy="30" r="26"/>
      <circle id="fill"  cx="30" cy="30" r="26"/>
    </svg>
    <div id="timer-num">30</div>
  </div>
  <div id="timer-label">Așteptare...</div>
</div>

<div id="toast"></div>

<script>
// ==========================================
// 1. CONFIGURĂRI ȘI HELPERE
// ==========================================
const SUIT_SYMBOLS = { s:'♠', h:'♥', d:'♦', c:'♣' };
const RED_SUITS = ['h','d'];
let timerInterval = null;
const CIRCUMFERENCE = 2 * Math.PI * 26; // Pentru animația cercului

// Funcție internă pentru a construi HTML-ul unei cărți
function setCardData(elementId, rank, suit) {
    const el = document.getElementById(elementId);
    if (!el) return;

    if (!rank || !suit) {
        el.className = "card back";
        el.innerHTML = "";
        return;
    }

    const isRed = RED_SUITS.includes(suit);
    const sym = SUIT_SYMBOLS[suit] || suit;
    el.className = `card face ${isRed ? 'red' : 'black'}`;
    el.innerHTML = `<span class="rank">${rank}</span><span class="suit">${sym}</span>`;
}


// ==========================================
// 2. FUNCȚIILE TALE PENTRU RAGEMP (API)
// ==========================================

/**
 * Actualizează cărțile jucătorului local (ale tale).
 * Exemplu utilizare: updateMyCards('A', 's', 'K', 'h'); 
 */
function updateMyCards(rank1, suit1, rank2, suit2) {
    setCardData('pc1', rank1, suit1);
    setCardData('pc2', rank2, suit2);
}

/**
 * Actualizează cărțile de pe masă (community cards).
 * Trimite un array de obiecte. Dacă trimiți 3 cărți, arată Flop-ul. Dacă trimiți 5, arată River-ul.
 * Exemplu: updateTableCards([{r:'A', s:'s'}, {r:'10', s:'d'}, {r:'2', s:'c'}])
 */
function updateTableCards(cardsArray) {
    for (let i = 1; i <= 5; i++) {
        const el = document.getElementById(`cc${i}`);
        const cardData = cardsArray[i - 1]; // Indexul array-ului începe de la 0

        if (cardData) {
            el.style.display = 'flex'; // Arată cartea
            setCardData(`cc${i}`, cardData.r, cardData.s);
        } else {
            el.style.display = 'none'; // Ascunde cartea dacă nu există (ex: turn/river)
        }
    }
}

/**
 * Afișează sau ascunde butoanele de acțiune (Fold, Check, Raise etc.).
 * Exemplu: toggleActionButtons(true) -> le arată; toggleActionButtons(false) -> le ascunde.
 */
function toggleActionButtons(isVisible) {
    const actionsEl = document.getElementById('actions');
    if (isVisible) {
        actionsEl.classList.add('visible'); // Asigură-te că ai în CSS `.actions.visible { display: flex; }` sau similar
    } else {
        actionsEl.classList.remove('visible');
    }
}

/**
 * Setează cine e la rând în acest moment.
 * Va schimba numele sub timer și va evidenția jucătorul în lista din stânga.
 * Exemplu: setActivePlayer(1, "xXDarkBoyXx")
 */
function setActivePlayer(playerIndex, playerName) {
    // Schimbă textul timer-ului
    document.getElementById('timer-label').textContent = playerName || "Așteptare...";
    
    // Evidențiază rândul în lista de jucători
    const rows = document.querySelectorAll('.pl-row');
    rows.forEach((row, i) => {
        if (i === playerIndex) {
            row.classList.add('active');
        } else {
            row.classList.remove('active');
        }
    });
}

/**
 * Pornește timer-ul circular.
 * Exemplu: startTimer(30) -> pornește de la 30 secunde.
 */
function startTimer(seconds) {
    clearInterval(timerInterval); // Oprește orice timer vechi
    
    document.getElementById('timer-wrap').classList.add('visible');
    
    const numEl = document.getElementById('timer-num');
    const fillEl = document.getElementById('fill');
    let timeLeft = seconds;
    
    fillEl.style.strokeDasharray = CIRCUMFERENCE;

    function tick() {
        numEl.textContent = timeLeft;
        const ratio = timeLeft / seconds;
        fillEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);

        // Schimbă culoarea pe măsură ce scade timpul
        if (ratio < 0.34) fillEl.style.stroke = '#e74c3c'; // Roșu
        else if (ratio < 0.67) fillEl.style.stroke = '#f39c12'; // Portocaliu
        else fillEl.style.stroke = 'var(--gold)'; // Auriu (culoarea ta)

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            document.getElementById('timer-wrap').classList.remove('visible');
            // Aici poți chema mp.trigger dacă vrei să anunți serverul că a expirat timpul
        }
        timeLeft--;
    }
    
    tick(); // Execută imediat
    timerInterval = setInterval(tick, 1000);
}

/**
 * Oprește și ascunde timer-ul manual.
 */
function stopTimer() {
    clearInterval(timerInterval);
    document.getElementById('timer-wrap').classList.remove('visible');
}


// ==========================================
// 3. EVENT-URI SPRE CLIENT (RageMP)
// ==========================================

// Această funcție este chemată când apeși pe butoanele din HTML
function sendAction(actionName) {
    // Aici trimiți acțiunea înapoi către scriptul tău client-side de RageMP
    if (typeof mp !== 'undefined') {
        mp.trigger('Poker_PlayerAction', actionName);
    } else {
        console.log("Action sent to server:", actionName); // Pentru testare în browser
    }
    
    // De obicei, după ce faci o acțiune, îți ascunzi butoanele și oprești timer-ul
    toggleActionButtons(false);
    stopTimer();
}

// ==========================================
// ZONA DE TEST (Așteaptă 1 secundă și simulează un scenariu)
// Pentru a vedea cum arată în browser, decomentează blocul de mai jos:
// ==========================================

setTimeout(() => {
    // 1. Îți dăm cărțile
    updateMyCards('A', 's', 'K', 'h');
    
    // 2. Punem FLOP pe masă
    updateTableCards([ {r:'7', s:'h'}, {r:'J', s:'s'}, {r:'3', s:'d'}, {r:'4', s:'s'}, {r:'3', s:'c'} ]);
    
    // 3. E rândul tău (index 0, nume "Tu joci")
    setActivePlayer(0, "Tu joci");
    
    // 4. Arătăm butoanele și pornim timpul
    toggleActionButtons(true);
    startTimer(30);
}, 1000);

</script>
</body>
</html>
