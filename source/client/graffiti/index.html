<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graffiti Canvas</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        *:not(input):not(textarea):not(#graffitiCanvas) {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div class="graffiti-container">
        <!-- LEFT PANEL: Controls -->
        <div class="graffiti-left">
            <div class="graffiti-title">&#x1F3A8; SPRAY GRAFFITI</div>

            <!-- MODE TABS -->
            <div class="mode-tabs">
                <button class="mode-tab active" id="tabText">&#x1F4DD; TEXT</button>
                <button class="mode-tab" id="tabDraw">&#x270F;&#xFE0F; DESEN</button>
            </div>

            <!-- COLOR PALETTE (shared by both modes) -->
            <div class="color-palette-section">
                <label class="palette-label">Culori</label>
                <div class="color-grid">
                    <div class="color-btn active" style="background:#FFFFFF" data-color="#FFFFFF"></div>
                    <div class="color-btn" style="background:#C0C0C0" data-color="#C0C0C0"></div>
                    <div class="color-btn" style="background:#808080" data-color="#808080"></div>
                    <div class="color-btn" style="background:#404040" data-color="#404040"></div>
                    <div class="color-btn" style="background:#000000; border-color:#333" data-color="#000000"></div>
                    <div class="color-btn" style="background:#FF0000" data-color="#FF0000"></div>
                    <div class="color-btn" style="background:#CC0000" data-color="#CC0000"></div>
                    <div class="color-btn" style="background:#FF6600" data-color="#FF6600"></div>
                    <div class="color-btn" style="background:#FF8C00" data-color="#FF8C00"></div>
                    <div class="color-btn" style="background:#FFA500" data-color="#FFA500"></div>
                    <div class="color-btn" style="background:#FFFF00" data-color="#FFFF00"></div>
                    <div class="color-btn" style="background:#CCFF00" data-color="#CCFF00"></div>
                    <div class="color-btn" style="background:#00FF00" data-color="#00FF00"></div>
                    <div class="color-btn" style="background:#00CC44" data-color="#00CC44"></div>
                    <div class="color-btn" style="background:#008800" data-color="#008800"></div>
                    <div class="color-btn" style="background:#00FFFF" data-color="#00FFFF"></div>
                    <div class="color-btn" style="background:#00AAFF" data-color="#00AAFF"></div>
                    <div class="color-btn" style="background:#0088FF" data-color="#0088FF"></div>
                    <div class="color-btn" style="background:#0000FF" data-color="#0000FF"></div>
                    <div class="color-btn" style="background:#0000AA" data-color="#0000AA"></div>
                    <div class="color-btn" style="background:#8800FF" data-color="#8800FF"></div>
                    <div class="color-btn" style="background:#AA00FF" data-color="#AA00FF"></div>
                    <div class="color-btn" style="background:#FF00FF" data-color="#FF00FF"></div>
                    <div class="color-btn" style="background:#FF00AA" data-color="#FF00AA"></div>
                    <div class="color-btn" style="background:#FF88AA" data-color="#FF88AA"></div>
                    <div class="color-btn" style="background:#FFD700" data-color="#FFD700"></div>
                    <div class="color-btn" style="background:#8B4513" data-color="#8B4513"></div>
                    <div class="color-btn" style="background:#D2691E" data-color="#D2691E"></div>
                    <div class="color-btn" style="background:#2F4F4F" data-color="#2F4F4F"></div>
                    <div class="color-btn" style="background:#191970" data-color="#191970"></div>
                </div>
                <div class="color-wheel-row">
                    <div class="custom-rgb-toggle" id="customRgbToggle">
                        <div class="rgb-swatch" id="rgbSwatch" style="background:#FF8C00"></div>
                        <span class="color-wheel-label">Custom RGB ▼</span>
                    </div>
                </div>
                <div class="custom-rgb-panel" id="customRgbPanel">
                    <div class="rgb-slider-row">
                        <label class="rgb-label" style="color:#ff4444">R</label>
                        <input type="range" class="rgb-slider rgb-r" id="sliderR" min="0" max="255" value="255">
                        <span class="rgb-val" id="valR">255</span>
                    </div>
                    <div class="rgb-slider-row">
                        <label class="rgb-label" style="color:#44ff44">G</label>
                        <input type="range" class="rgb-slider rgb-g" id="sliderG" min="0" max="255" value="140">
                        <span class="rgb-val" id="valG">140</span>
                    </div>
                    <div class="rgb-slider-row">
                        <label class="rgb-label" style="color:#4488ff">B</label>
                        <input type="range" class="rgb-slider rgb-b" id="sliderB" min="0" max="255" value="0">
                        <span class="rgb-val" id="valB">0</span>
                    </div>
                    <div class="rgb-hex-row">
                        <label class="rgb-label">HEX</label>
                        <input type="text" class="rgb-hex-input" id="hexInput" value="#FF8C00" maxlength="7" spellcheck="false">
                        <button class="rgb-apply-btn" id="rgbApplyBtn">&#x2714; Aplica</button>
                    </div>
                </div>
            </div>

            <!-- TEXT MODE PANEL -->
            <div id="textPanel" class="mode-panel">
                <div class="toolbar">
                    <div class="toolbar-section" style="flex:1">
                        <label>Text</label>
                        <textarea id="textInput" class="text-input" placeholder="Scrie textul... (Enter = linie noua)" rows="3" maxlength="500"></textarea>
                    </div>
                </div>
                <div class="toolbar">
                    <div class="toolbar-section">
                        <label>Font</label>
                        <button class="tool-btn font-open-btn" id="fontSelectedBtn">
                            <span class="font-preview-text" style="font-family: Arial">Arial</span>
                        </button>
                        <input type="hidden" id="fontSelect" value="Arial">
                    </div>
                    <div class="toolbar-section">
                        <label>Stil</label>
                        <button class="tool-btn" id="btnBold">&#x1D401; Bold</button>
                        <button class="tool-btn" id="btnItalic">&#x1D43C; Italic</button>
                        <button class="tool-btn" id="btnUnderline">&#x0332;U&#x0332; Underline</button>
                        <button class="tool-btn" id="btnStrike">&#x0336;S&#x0336; Strike</button>
                    </div>
                </div>
                <!-- INLINE FONT GRID (expandable) -->

                <div class="toolbar">
                    <div class="toolbar-section">
                        <label>Efecte</label>
                        <button class="tool-btn" id="btnOutline">&#x2B1C; Outline</button>
                        <input type="color" id="outlineColorPicker" value="#000000" title="Outline color" class="outline-color-picker">
                        <button class="tool-btn" id="btnShadow">&#x1F4A8; Shadow</button>
                        <button class="tool-btn" id="btnGlow">&#x2728; Glow</button>
                    </div>
                    <div class="toolbar-section">
                        <label>Aliniere</label>
                        <button class="tool-btn" id="btnAlignLeft">&#x25C0;</button>
                        <button class="tool-btn active" id="btnAlignCenter">&#x25CF;</button>
                        <button class="tool-btn" id="btnAlignRight">&#x25B6;</button>
                    </div>
                </div>
                <div class="keybinds-bar">
                    <div class="keybind"><kbd>LClick</kbd> <span>Plaseaza text</span></div>
                    <div class="keybind"><kbd>RClick</kbd><span>+</span><kbd>Drag</kbd> <span>Roteste</span></div>
                    <div class="keybind"><kbd>Scroll</kbd> <span>Marime</span></div>
                </div>
            </div>

            <!-- DRAW MODE PANEL -->
            <div id="drawPanel" class="mode-panel" style="display:none">
            <div class="toolbar">
                <div class="toolbar-section">
                    <label>Marime</label>
                    <button class="size-btn" data-size="3">3</button>
                    <button class="size-btn" data-size="6">6</button>
                    <button class="size-btn active" data-size="12">12</button>
                    <button class="size-btn" data-size="24">24</button>
                    <button class="size-btn" data-size="40">40</button>
                </div>
                <div class="toolbar-section">
                    <label>Unelte</label>
                    <button class="tool-btn active" id="btnBrush">&#x1F58C; Brush</button>
                    <button class="tool-btn" id="btnSpray">&#x1F4A8; Spray</button>
                    <button class="tool-btn" id="btnEraser">&#x1F9F9; Eraser</button>
                    <button class="tool-btn" id="btnFill">&#x1FAA3; Fill</button>
                </div>
                <div class="toolbar-section">
                    <button class="tool-btn" id="btnUndo">&#x21A9; Undo</button>
                    <button class="tool-btn" id="btnClear">&#x1F5D1; Clear</button>
                    <button class="tool-btn" id="btnImgUrl">&#x1F310; URL</button>
                </div>
            </div>
            </div><!-- /drawPanel -->

            <!-- ACTION BUTTONS -->
            <div class="actions">
                <button class="btn-place" id="btnPlace">&#x2714; PLACE</button>
                <button class="btn-cancel" id="btnCancel">&#x2716; CANCEL</button>
            </div>

            <div class="info-text">Deseneaza graffiti-ul tau, apoi apasa <kbd>PLACE</kbd> pentru a-l plasa pe un perete.</div>
        </div>

        <!-- RIGHT PANEL: Canvas Preview -->
        <div class="graffiti-right">
            <div class="canvas-wrapper">
                <canvas id="graffitiCanvas" width="512" height="512"></canvas>
            </div>
        </div>
    </div>

    <!-- SPRAY CURSOR (visual indicator for brush size) -->
    <div class="spray-cursor" id="sprayCursor"></div>

    <!-- FONT OVERLAY PANEL -->
    <div class="font-overlay" id="fontInlinePanel">
        <div class="font-overlay-inner">
            <div class="font-inline-header">
                <input type="text" id="fontGridSearch" class="font-grid-search" placeholder="&#x1F50D; Cauta font..." spellcheck="false">
                <button class="font-grid-close" id="fontGridClose">&#x2716;</button>
            </div>
            <div class="font-grid-container" id="fontGridContainer"></div>
        </div>
    </div>



    <!-- IMAGE URL MODAL -->
    <div class="url-modal-overlay" id="urlModal">
        <div class="url-modal">
            <div class="url-modal-title">&#x1F310; Importa Imagine din URL</div>
            <input type="text" id="urlInput" class="url-input" placeholder="https://i.imgur.com/example.png" spellcheck="false">
            <div class="url-status" id="urlStatus"></div>
            <div class="url-preview-wrap">
                <img id="urlPreview" class="url-preview">
            </div>
            <div class="url-actions">
                <button class="btn-place" id="btnUrlLoad">&#x2714; INCARCA</button>
                <button class="btn-cancel" id="btnUrlCancel">&#x2716; ANULEAZA</button>
            </div>
        </div>
    </div>

    <script>
        // ──────────────────────────────────────────
        // CANVAS SETUP
        // ──────────────────────────────────────────
        const canvas  = document.getElementById('graffitiCanvas');
        const ctx     = canvas.getContext('2d');
        const cursor  = document.getElementById('sprayCursor');

        // Start with transparent canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ──────────────────────────────────────────
        // ──────────────────────────────────────────
        // STATE
        // ──────────────────────────────────────────
        let currentColor   = '#FFFFFF';
        let currentSize    = 12;
        let currentTool    = 'brush';   // brush | spray | eraser | fill
        let currentMode    = 'text';    // text | draw
        let isDrawing      = false;
        let lastX          = 0;
        let lastY          = 0;
        let historyStack   = [];
        const MAX_HISTORY  = 30;

        // Save initial state
        saveHistory();

        // ──────────────────────────────────────────
        // HISTORY (UNDO)
        // ──────────────────────────────────────────
        function saveHistory() {
            if (historyStack.length >= MAX_HISTORY) historyStack.shift();
            historyStack.push(canvas.toDataURL());
        }

        function undo() {
            if (historyStack.length <= 1) return;
            historyStack.pop(); // remove current
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = historyStack[historyStack.length - 1];
        }

        // ──────────────────────────────────────────
        // DRAWING
        // ──────────────────────────────────────────
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function drawLine(x0, y0, x1, y1) {
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineWidth   = currentSize;
            ctx.lineCap     = 'round';
            ctx.lineJoin    = 'round';
            ctx.globalAlpha = 1.0;
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawSpray(x, y) {
            const density = Math.floor(currentSize * 2.5);
            const radius  = currentSize * 1.5;
            ctx.fillStyle = currentColor;
            for (let i = 0; i < density; i++) {
                const angle  = Math.random() * Math.PI * 2;
                const r      = Math.random() * radius;
                const dx     = Math.cos(angle) * r;
                const dy     = Math.sin(angle) * r;
                ctx.globalAlpha = Math.random() * 0.4 + 0.1;
                ctx.fillRect(x + dx, y + dy, 1.5, 1.5);
            }
            ctx.globalAlpha = 1.0;
        }

        // Flood fill
        function floodFill(startX, startY, fillColor) {
            startX = Math.floor(startX);
            startY = Math.floor(startY);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data      = imageData.data;
            const w         = canvas.width;
            const h         = canvas.height;

            const targetIdx  = (startY * w + startX) * 4;
            const targetR    = data[targetIdx];
            const targetG    = data[targetIdx + 1];
            const targetB    = data[targetIdx + 2];
            const targetA    = data[targetIdx + 3];

            // Parse fill color
            const tempC  = document.createElement('canvas').getContext('2d');
            tempC.fillStyle = fillColor;
            tempC.fillRect(0, 0, 1, 1);
            const fc = tempC.getImageData(0, 0, 1, 1).data;

            if (targetR === fc[0] && targetG === fc[1] && targetB === fc[2] && targetA === fc[3]) return;

            const tolerance = 20;
            const stack = [[startX, startY]];
            const visited = new Uint8Array(w * h);

            function matches(idx) {
                return Math.abs(data[idx] - targetR) <= tolerance &&
                       Math.abs(data[idx + 1] - targetG) <= tolerance &&
                       Math.abs(data[idx + 2] - targetB) <= tolerance &&
                       Math.abs(data[idx + 3] - targetA) <= tolerance;
            }

            while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                const pi = cy * w + cx;
                if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
                if (visited[pi]) continue;
                const idx = pi * 4;
                if (!matches(idx)) continue;

                visited[pi] = 1;
                data[idx]     = fc[0];
                data[idx + 1] = fc[1];
                data[idx + 2] = fc[2];
                data[idx + 3] = 255;

                stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // ──────────────────────────────────────────
        // TEXT STAMP STATE
        // ──────────────────────────────────────────
        let stampScale    = 0.5;
        let stampRotation = 0;
        let stampMouseX   = canvas.width / 2;
        let stampMouseY   = canvas.height / 2;
        let stampImage    = null; // offscreen rendered text image

        // Drag-to-rotate state
        let isRotating      = false;
        let rotateAnchorX   = 0;
        let rotateAnchorY   = 0;
        let rotateBaseAngle = 0;

        function generateStampImage() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) { stampImage = null; return; }

            const font = document.getElementById('fontSelect').value;
            const baseFontSize = 80;

            let fontStyle = '';
            if (textBold) fontStyle += 'bold ';
            if (textItalic) fontStyle += 'italic ';

            const fullFont = fontStyle + baseFontSize + 'px "' + font + '"';

            // Measure text — NO auto-wrap, only break on explicit newlines
            const measureCtx = document.createElement('canvas').getContext('2d');
            measureCtx.font = fullFont;

            const lines = text.split('\n');
            if (lines.length === 0) lines.push('');

            const lineHeight = baseFontSize * 1.2;
            let maxW = 0;
            for (const line of lines) {
                const w = measureCtx.measureText(line).width;
                if (w > maxW) maxW = w;
            }

            const pad = Math.ceil(baseFontSize * 0.4);
            const cw = Math.ceil(maxW) + pad * 2;
            const ch = Math.ceil(lines.length * lineHeight) + pad * 2;

            const offCanvas = document.createElement('canvas');
            offCanvas.width = cw;
            offCanvas.height = ch;
            const offCtx = offCanvas.getContext('2d');

            offCtx.font = fullFont;
            offCtx.textBaseline = 'middle';

            // Text alignment
            let textAlignX;
            if (textAlign === 'left') {
                offCtx.textAlign = 'left';
                textAlignX = pad;
            } else if (textAlign === 'right') {
                offCtx.textAlign = 'right';
                textAlignX = cw - pad;
            } else {
                offCtx.textAlign = 'center';
                textAlignX = cw / 2;
            }

            if (textShadow) {
                offCtx.shadowColor = 'rgba(0,0,0,0.7)';
                offCtx.shadowBlur = 8;
                offCtx.shadowOffsetX = 4;
                offCtx.shadowOffsetY = 4;
            }

            if (textGlow) {
                offCtx.shadowColor = currentColor;
                offCtx.shadowBlur = 15;
                offCtx.shadowOffsetX = 0;
                offCtx.shadowOffsetY = 0;
            }

            for (let i = 0; i < lines.length; i++) {
                const y = pad + lineHeight / 2 + i * lineHeight;
                const lineW = measureCtx.measureText(lines[i]).width;
                if (textOutline) {
                    offCtx.strokeStyle = outlineColor;
                    offCtx.lineWidth = Math.max(2, baseFontSize / 12);
                    offCtx.lineJoin = 'round';
                    offCtx.strokeText(lines[i], textAlignX, y);
                }
                offCtx.fillStyle = currentColor;
                offCtx.fillText(lines[i], textAlignX, y);

                // Underline
                if (textUnderline) {
                    let lx;
                    if (textAlign === 'left') lx = pad;
                    else if (textAlign === 'right') lx = cw - pad - lineW;
                    else lx = (cw - lineW) / 2;
                    offCtx.save();
                    offCtx.shadowColor = 'transparent';
                    offCtx.strokeStyle = currentColor;
                    offCtx.lineWidth = Math.max(2, baseFontSize / 20);
                    offCtx.beginPath();
                    offCtx.moveTo(lx, y + baseFontSize * 0.45);
                    offCtx.lineTo(lx + lineW, y + baseFontSize * 0.45);
                    offCtx.stroke();
                    offCtx.restore();
                }

                // Strikethrough
                if (textStrike) {
                    let lx;
                    if (textAlign === 'left') lx = pad;
                    else if (textAlign === 'right') lx = cw - pad - lineW;
                    else lx = (cw - lineW) / 2;
                    offCtx.save();
                    offCtx.shadowColor = 'transparent';
                    offCtx.strokeStyle = currentColor;
                    offCtx.lineWidth = Math.max(2, baseFontSize / 20);
                    offCtx.beginPath();
                    offCtx.moveTo(lx, y);
                    offCtx.lineTo(lx + lineW, y);
                    offCtx.stroke();
                    offCtx.restore();
                }
            }

            offCtx.shadowColor = 'transparent';
            stampImage = offCanvas;
        }

        function renderCanvasWithStampPreview() {
            // Redraw canvas from last saved history state
            if (historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    drawStampGhost();
                };
                img.src = historyStack[historyStack.length - 1];
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawStampGhost();
            }
        }

        function drawStampGhost() {
            if (!stampImage || currentMode !== 'text') return;

            ctx.save();
            ctx.translate(stampMouseX, stampMouseY);
            ctx.rotate(stampRotation);
            ctx.scale(stampScale, stampScale);
            ctx.globalAlpha = 0.6;
            ctx.drawImage(stampImage, -stampImage.width / 2, -stampImage.height / 2);
            ctx.restore();
        }

        function placeStamp() {
            if (!stampImage || currentMode !== 'text') return;

            // Restore canvas to last clean state, then stamp permanently
            if (historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);

                    ctx.save();
                    ctx.translate(stampMouseX, stampMouseY);
                    ctx.rotate(stampRotation);
                    ctx.scale(stampScale, stampScale);
                    ctx.globalAlpha = 1.0;
                    ctx.drawImage(stampImage, -stampImage.width / 2, -stampImage.height / 2);
                    ctx.restore();

                    saveHistory();
                    renderCanvasWithStampPreview();
                };
                img.src = historyStack[historyStack.length - 1];
            } else {
                ctx.save();
                ctx.translate(stampMouseX, stampMouseY);
                ctx.rotate(stampRotation);
                ctx.scale(stampScale, stampScale);
                ctx.globalAlpha = 1.0;
                ctx.drawImage(stampImage, -stampImage.width / 2, -stampImage.height / 2);
                ctx.restore();

                saveHistory();
                renderCanvasWithStampPreview();
            }
        }

        // ──────────────────────────────────────────
        // MOUSE EVENTS
        // ──────────────────────────────────────────
        canvas.addEventListener('mousedown', (e) => {
            if (currentMode === 'text') {
                if (e.button === 0) {
                    // Left click → place stamp
                    placeStamp();
                } else if (e.button === 2) {
                    // Right click → start drag-to-rotate
                    isRotating = true;
                    const pos = getCanvasPos(e);
                    rotateAnchorX = pos.x;
                    rotateAnchorY = pos.y;
                    rotateBaseAngle = stampRotation;
                }
                return;
            }

            const pos = getCanvasPos(e);

            if (currentTool === 'fill') {
                saveHistory();
                floodFill(pos.x, pos.y, currentColor);
                return;
            }

            isDrawing = true;
            lastX = pos.x;
            lastY = pos.y;

            if (currentTool === 'spray') {
                drawSpray(pos.x, pos.y);
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (currentMode === 'text') {
                cursor.style.display = 'none';
                const pos = getCanvasPos(e);
                if (isRotating) {
                    const dx = pos.x - rotateAnchorX;
                    const dy = pos.y - rotateAnchorY;
                    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                        stampRotation = rotateBaseAngle + Math.atan2(dy, dx);
                    }
                } else {
                    stampMouseX = pos.x;
                    stampMouseY = pos.y;
                }
                renderCanvasWithStampPreview();
                return;
            }
            // Update custom cursor position
            cursor.style.left   = e.clientX + 'px';
            cursor.style.top    = e.clientY + 'px';
            cursor.style.width  = currentSize * 2 + 'px';
            cursor.style.height = currentSize * 2 + 'px';
            cursor.style.display = 'block';

            if (!isDrawing) return;
            const pos = getCanvasPos(e);

            if (currentTool === 'spray') {
                drawSpray(pos.x, pos.y);
            } else {
                drawLine(lastX, lastY, pos.x, pos.y);
            }

            lastX = pos.x;
            lastY = pos.y;
        });

        canvas.addEventListener('wheel', (e) => {
            if (currentMode !== 'text') return;
            e.preventDefault();
            if (e.deltaY < 0) {
                stampScale = Math.min(stampScale + 0.1, 5.0);
            } else {
                stampScale = Math.max(stampScale - 0.1, 0.2);
            }
            renderCanvasWithStampPreview();
        }, { passive: false });

        canvas.addEventListener('mouseup', (e) => {
            if (currentMode === 'text' && e.button === 2) {
                isRotating = false;
                return;
            }
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
            isRotating = false;
            cursor.style.display = 'none';
            // In text mode, restore clean canvas (remove ghost stamp)
            if (currentMode === 'text' && historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = historyStack[historyStack.length - 1];
            }
        });

        // ──────────────────────────────────────────
        // COLOR BUTTONS
        // ──────────────────────────────────────────
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
                if (currentTool === 'eraser') {
                    currentTool = 'brush';
                    updateToolButtons();
                }
                generateStampImage();
                renderCanvasWithStampPreview();
            });
        });

        // ──────────────────────────────────────────
        // CUSTOM RGB PICKER
        // ──────────────────────────────────────────
        const customRgbToggle = document.getElementById('customRgbToggle');
        const customRgbPanel = document.getElementById('customRgbPanel');
        const sliderR = document.getElementById('sliderR');
        const sliderG = document.getElementById('sliderG');
        const sliderB = document.getElementById('sliderB');
        const valR = document.getElementById('valR');
        const valG = document.getElementById('valG');
        const valB = document.getElementById('valB');
        const hexInput = document.getElementById('hexInput');
        const rgbSwatch = document.getElementById('rgbSwatch');
        const rgbApplyBtn = document.getElementById('rgbApplyBtn');
        let rgbPanelOpen = false;

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
            if (hex.length !== 6) return null;
            const n = parseInt(hex, 16);
            if (isNaN(n)) return null;
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }

        function updateRgbSwatch() {
            const hex = rgbToHex(parseInt(sliderR.value), parseInt(sliderG.value), parseInt(sliderB.value));
            rgbSwatch.style.background = hex;
            hexInput.value = hex;
            valR.textContent = sliderR.value;
            valG.textContent = sliderG.value;
            valB.textContent = sliderB.value;
        }

        function applyRgbColor() {
            const hex = rgbToHex(parseInt(sliderR.value), parseInt(sliderG.value), parseInt(sliderB.value));
            currentColor = hex;
            rgbSwatch.style.background = hex;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            if (currentTool === 'eraser') {
                currentTool = 'brush';
                updateToolButtons();
            }
            generateStampImage();
            renderCanvasWithStampPreview();
        }

        customRgbToggle.addEventListener('click', () => {
            rgbPanelOpen = !rgbPanelOpen;
            customRgbPanel.classList.toggle('open', rgbPanelOpen);
        });

        [sliderR, sliderG, sliderB].forEach(s => {
            s.addEventListener('input', updateRgbSwatch);
        });

        rgbApplyBtn.addEventListener('click', applyRgbColor);

        hexInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const rgb = hexToRgb(hexInput.value);
                if (rgb) {
                    sliderR.value = rgb.r;
                    sliderG.value = rgb.g;
                    sliderB.value = rgb.b;
                    updateRgbSwatch();
                    applyRgbColor();
                }
            }
        });

        // ──────────────────────────────────────────
        // SIZE BUTTONS
        // ──────────────────────────────────────────
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSize = parseInt(btn.dataset.size);
            });
        });

        // ──────────────────────────────────────────
        // TOOL BUTTONS
        // ──────────────────────────────────────────
        function updateToolButtons() {
            document.querySelectorAll('#btnBrush, #btnSpray, #btnEraser, #btnFill')
                .forEach(b => b.classList.remove('active'));

            if (currentTool === 'brush')  document.getElementById('btnBrush').classList.add('active');
            if (currentTool === 'spray')  document.getElementById('btnSpray').classList.add('active');
            if (currentTool === 'eraser') document.getElementById('btnEraser').classList.add('active');
            if (currentTool === 'fill')   document.getElementById('btnFill').classList.add('active');

            canvas.style.cursor = currentTool === 'fill' ? 'cell' : 'crosshair';
        }

        document.getElementById('btnBrush').addEventListener('click', () => { currentTool = 'brush'; updateToolButtons(); });
        document.getElementById('btnSpray').addEventListener('click', () => { currentTool = 'spray'; updateToolButtons(); });
        document.getElementById('btnEraser').addEventListener('click', () => { currentTool = 'eraser'; updateToolButtons(); });
        document.getElementById('btnFill').addEventListener('click', () => { currentTool = 'fill'; updateToolButtons(); });

        document.getElementById('btnUndo').addEventListener('click', undo);

        document.getElementById('btnClear').addEventListener('click', () => {
            saveHistory();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // ──────────────────────────────────────────
        // IMAGE URL IMPORT
        // ──────────────────────────────────────────
        const urlModal   = document.getElementById('urlModal');
        const urlInput   = document.getElementById('urlInput');
        const urlStatus  = document.getElementById('urlStatus');
        const urlPreview = document.getElementById('urlPreview');

        const ALLOWED_HOSTS = [
            'i.imgur.com', 'imgur.com',
            'i.ibb.co', 'ibb.co',
            'upload.wikimedia.org',
            'i.redd.it', 'preview.redd.it',
            'cdn.discordapp.com', 'media.discordapp.net',
            'pbs.twimg.com',
            'i.pinimg.com'
        ];

        function isAllowedImageUrl(url) {
            try {
                const u = new URL(url);
                if (u.protocol !== 'https:') return { ok: false, reason: 'Doar HTTPS este permis.' };
                const host = u.hostname.toLowerCase();
                const allowed = ALLOWED_HOSTS.some(h => host === h || host.endsWith('.' + h));
                if (!allowed) return { ok: false, reason: 'Host nepermis. Foloseste: imgur, ibb, discord, reddit, etc.' };
                const ext = u.pathname.toLowerCase();
                const validExt = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp'];
                const hasValidExt = validExt.some(e => ext.endsWith(e));
                if (!hasValidExt) return { ok: false, reason: 'URL-ul trebuie sa fie o imagine (.png, .jpg, .gif, .webp).' };
                return { ok: true };
            } catch (e) {
                return { ok: false, reason: 'URL invalid.' };
            }
        }

        function showUrlModal() {
            urlModal.style.display = 'flex';
            urlInput.value = '';
            urlStatus.textContent = '';
            urlStatus.className = 'url-status';
            urlPreview.style.display = 'none';
            urlInput.focus();
        }

        function hideUrlModal() {
            urlModal.style.display = 'none';
        }

        document.getElementById('btnImgUrl').addEventListener('click', showUrlModal);
        document.getElementById('btnUrlCancel').addEventListener('click', hideUrlModal);

        urlInput.addEventListener('input', () => {
            const val = urlInput.value.trim();
            if (!val) {
                urlStatus.textContent = '';
                urlPreview.style.display = 'none';
                return;
            }
            const check = isAllowedImageUrl(val);
            if (!check.ok) {
                urlStatus.textContent = check.reason;
                urlStatus.className = 'url-status url-error';
                urlPreview.style.display = 'none';
                return;
            }
            urlStatus.textContent = 'Se incarca previzualizarea...';
            urlStatus.className = 'url-status url-loading';
            urlPreview.style.display = 'none';

            const testImg = new Image();
            testImg.crossOrigin = 'anonymous';
            testImg.onload = () => {
                urlPreview.src = val;
                urlPreview.style.display = 'block';
                urlStatus.textContent = 'Imagine valida! Apasa INCARCA.';
                urlStatus.className = 'url-status url-ok';
            };
            testImg.onerror = () => {
                urlStatus.textContent = 'Nu se poate incarca imaginea. Verifica URL-ul.';
                urlStatus.className = 'url-status url-error';
                urlPreview.style.display = 'none';
            };
            testImg.src = val;
        });

        document.getElementById('btnUrlLoad').addEventListener('click', () => {
            const val = urlInput.value.trim();
            const check = isAllowedImageUrl(val);
            if (!check.ok) {
                urlStatus.textContent = check.reason;
                urlStatus.className = 'url-status url-error';
                return;
            }
            if (urlPreview.style.display === 'none') {
                urlStatus.textContent = 'Asteapta sa se incarce imaginea.';
                urlStatus.className = 'url-status url-error';
                return;
            }
            saveHistory();
            const loadImg = new Image();
            loadImg.crossOrigin = 'anonymous';
            loadImg.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(loadImg, 0, 0, canvas.width, canvas.height);
                saveHistory();
                hideUrlModal();
            };
            loadImg.onerror = () => {
                urlStatus.textContent = 'Eroare la incarcarea imaginii.';
                urlStatus.className = 'url-status url-error';
            };
            loadImg.src = val;
        });

        urlModal.addEventListener('click', (e) => {
            if (e.target === urlModal) hideUrlModal();
        });

        // ──────────────────────────────────────────
        // ACTION BUTTONS
        // ──────────────────────────────────────────
        document.getElementById('btnPlace').addEventListener('click', () => {
            function doExport() {
                const MAX_DATA_SIZE = 2000000; // ~2MB max for network transfer

                // Check if canvas has any transparent pixels
                const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let hasTransparency = false;
                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] < 250) { hasTransparency = true; break; }
                }

                let dataURL;
                if (hasTransparency) {
                    // PNG to preserve transparency
                    dataURL = canvas.toDataURL('image/png');
                    // If PNG too large, resize
                    if (dataURL.length > MAX_DATA_SIZE) {
                        const small = document.createElement('canvas');
                        small.width = 256;
                        small.height = 256;
                        small.getContext('2d').drawImage(canvas, 0, 0, 256, 256);
                        dataURL = small.toDataURL('image/png');
                    }
                } else {
                    // JPEG for fully opaque images (photos) — much smaller
                    let quality = 0.85;
                    dataURL = canvas.toDataURL('image/jpeg', quality);
                    while (dataURL.length > MAX_DATA_SIZE && quality > 0.2) {
                        quality -= 0.1;
                        dataURL = canvas.toDataURL('image/jpeg', quality);
                    }
                    if (dataURL.length > MAX_DATA_SIZE) {
                        const small = document.createElement('canvas');
                        small.width = 256;
                        small.height = 256;
                        small.getContext('2d').drawImage(canvas, 0, 0, 256, 256);
                        dataURL = small.toDataURL('image/jpeg', 0.7);
                    }
                }

                sendChunkedToClient(dataURL);
            }

            // In text mode, restore clean canvas from history (remove ghost stamp overlay)
            if (currentMode === 'text' && historyStack.length > 0) {
                const cleanImg = new Image();
                cleanImg.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(cleanImg, 0, 0);
                    doExport();
                };
                cleanImg.src = historyStack[historyStack.length - 1];
                return;
            }

            doExport();
        });

        document.getElementById('btnCancel').addEventListener('click', () => {
            mp.trigger('Graffiti_CanvasCancel');
        });

        // ──────────────────────────────────────────
        // CHUNKED EXPORT TO CLIENT (avoids mp.trigger size limits)
        // ──────────────────────────────────────────
        function sendChunkedToClient(dataURL) {
            const pw = '2.0';
            const ph = '2.0';
            const CHUNK = 25000;
            const total = Math.ceil(dataURL.length / CHUNK);
            mp.trigger('Graffiti_CanvasStart', '' + total, pw, ph);
            for (let i = 0; i < total; i++) {
                mp.trigger('Graffiti_CanvasChunk', '' + i, dataURL.substring(i * CHUNK, (i + 1) * CHUNK));
            }
        }

        // ──────────────────────────────────────────
        // KEYBOARD SHORTCUTS
        // ──────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (currentMode === 'text') {
                if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); renderCanvasWithStampPreview(); }
                return;
            }
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.key === 'b') { currentTool = 'brush'; updateToolButtons(); }
            if (e.key === 's') { currentTool = 'spray'; updateToolButtons(); }
            if (e.key === 'e') { currentTool = 'eraser'; updateToolButtons(); }
            if (e.key === 'f') { currentTool = 'fill'; updateToolButtons(); }
        });

        // ──────────────────────────────────────────
        // MODE SWITCHING (TEXT / DRAW)
        // ──────────────────────────────────────────
        let textBold = false;
        let textItalic = false;
        let textOutline = false;
        let textShadow = false;
        let textUnderline = false;
        let textStrike = false;
        let textGlow = false;
        let textAlign = 'center';
        let outlineColor = '#000000';

        document.getElementById('tabText').addEventListener('click', () => {
            currentMode = 'text';
            document.getElementById('tabText').classList.add('active');
            document.getElementById('tabDraw').classList.remove('active');
            document.getElementById('textPanel').style.display = '';
            document.getElementById('drawPanel').style.display = 'none';
            canvas.style.cursor = 'crosshair';
            generateStampImage();
            renderCanvasWithStampPreview();
            setTimeout(() => document.getElementById('textInput').focus(), 50);
        });

        document.getElementById('tabDraw').addEventListener('click', () => {
            currentMode = 'draw';
            document.getElementById('tabDraw').classList.add('active');
            document.getElementById('tabText').classList.remove('active');
            document.getElementById('drawPanel').style.display = '';
            document.getElementById('textPanel').style.display = 'none';
            // Restore canvas to clean state (remove ghost stamp)
            if (historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = historyStack[historyStack.length - 1];
            }
        });

        // Text controls event listeners
        document.getElementById('textInput').addEventListener('input', () => {
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        // fontSelect change is handled by the custom dropdown selectFont()

        document.getElementById('btnBold').addEventListener('click', () => {
            textBold = !textBold;
            document.getElementById('btnBold').classList.toggle('active', textBold);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnItalic').addEventListener('click', () => {
            textItalic = !textItalic;
            document.getElementById('btnItalic').classList.toggle('active', textItalic);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnOutline').addEventListener('click', () => {
            textOutline = !textOutline;
            document.getElementById('btnOutline').classList.toggle('active', textOutline);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnShadow').addEventListener('click', () => {
            textShadow = !textShadow;
            if (textShadow) textGlow = false;
            document.getElementById('btnShadow').classList.toggle('active', textShadow);
            document.getElementById('btnGlow').classList.toggle('active', textGlow);
            generateStampImage();
            renderCanvasWithStampPreview();
        });

        document.getElementById('btnUnderline').addEventListener('click', () => {
            textUnderline = !textUnderline;
            document.getElementById('btnUnderline').classList.toggle('active', textUnderline);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnStrike').addEventListener('click', () => {
            textStrike = !textStrike;
            document.getElementById('btnStrike').classList.toggle('active', textStrike);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnGlow').addEventListener('click', () => {
            textGlow = !textGlow;
            if (textGlow) textShadow = false;
            document.getElementById('btnGlow').classList.toggle('active', textGlow);
            document.getElementById('btnShadow').classList.toggle('active', textShadow);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('outlineColorPicker').addEventListener('input', (e) => {
            outlineColor = e.target.value;
            generateStampImage();
            renderCanvasWithStampPreview();
        });

        // Text alignment buttons
        function setTextAlign(align) {
            textAlign = align;
            document.getElementById('btnAlignLeft').classList.toggle('active', align === 'left');
            document.getElementById('btnAlignCenter').classList.toggle('active', align === 'center');
            document.getElementById('btnAlignRight').classList.toggle('active', align === 'right');
            generateStampImage();
            renderCanvasWithStampPreview();
        }
        document.getElementById('btnAlignLeft').addEventListener('click', () => setTextAlign('left'));
        document.getElementById('btnAlignCenter').addEventListener('click', () => setTextAlign('center'));
        document.getElementById('btnAlignRight').addEventListener('click', () => setTextAlign('right'));



        // ──────────────────────────────────────────
        // CUSTOM FONT DROPDOWN
        // ──────────────────────────────────────────
        const builtinFonts = [
            { name: 'Arial', family: 'Arial' },
            { name: 'Times New Roman', family: 'Times New Roman' }
        ];

        let allFonts = [...builtinFonts];
        let selectedFont = 'Arial';

        const fontSelect = document.getElementById('fontSelect');
        const fontInlinePanel = document.getElementById('fontInlinePanel');
        const fontGridContainer = document.getElementById('fontGridContainer');
        const fontGridSearch = document.getElementById('fontGridSearch');
        const fontSelectedBtn = document.getElementById('fontSelectedBtn');

        function buildFontGrid(filter) {
            fontGridContainer.innerHTML = '';
            const filterLower = (filter || '').toLowerCase();
            allFonts.forEach(f => {
                if (filterLower && !f.name.toLowerCase().includes(filterLower)) return;
                const card = document.createElement('div');
                card.className = 'font-grid-card' + (f.family === selectedFont ? ' active' : '');
                card.dataset.family = f.family;
                card.innerHTML = '<div class="font-grid-preview" style="font-family: \'' + f.family + '\'">'+f.name+'</div>' +
                    '<div class="font-grid-name">' + f.name + '</div>';
                card.addEventListener('click', () => {
                    selectFont(f.family, f.name);
                });
                fontGridContainer.appendChild(card);
            });
        }

        function selectFont(family, name) {
            selectedFont = family;
            fontSelect.value = family;
            fontSelectedBtn.innerHTML = '<span class="font-preview-text" style="font-family: \'' + family + '\'">' + name + '</span>';
            closeFontGrid();
            generateStampImage();
            renderCanvasWithStampPreview();
        }

        let fontPanelOpen = false;

        function openFontGrid() {
            if (fontPanelOpen) return;
            fontPanelOpen = true;
            fontGridSearch.value = '';
            buildFontGrid('');
            fontInlinePanel.style.display = 'flex';
            fontSelectedBtn.classList.add('expanded');
            setTimeout(() => fontGridSearch.focus(), 100);
        }

        function closeFontGrid() {
            if (!fontPanelOpen) return;
            fontPanelOpen = false;
            fontInlinePanel.style.display = 'none';
            fontSelectedBtn.classList.remove('expanded');
        }

        function toggleFontGrid() {
            if (fontPanelOpen) closeFontGrid();
            else openFontGrid();
        }

        fontSelectedBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFontGrid();
        });

        document.getElementById('fontGridClose').addEventListener('click', closeFontGrid);

        fontGridSearch.addEventListener('input', () => {
            buildFontGrid(fontGridSearch.value);
        });

        // Load custom fonts from fonts/fonts.json
        function loadCustomFonts() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'fonts/fonts.json', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState !== 4) return;
                if (xhr.status !== 200 && xhr.responseText === '') {
                    console.warn('fonts.json not found or empty');
                    return;
                }
                let data;
                try { data = JSON.parse(xhr.responseText); } catch(e) { console.warn('fonts.json parse error', e); return; }
                if (!data.fonts || !data.fonts.length) return;

                // Build @font-face CSS rules
                let css = '';
                data.fonts.forEach(f => {
                    css += '@font-face { font-family: "' + f.name + '"; src: url("fonts/' + f.file + '"); font-display: block; }\n';
                });
                const style = document.createElement('style');
                style.textContent = css;
                document.head.appendChild(style);

                // Add fonts to the list
                data.fonts.forEach(f => {
                    allFonts.push({ name: f.name, family: f.name });
                });

                // Wait for fonts to actually load, then rebuild grid
                document.fonts.ready.then(() => {
                    buildFontGrid('');
                });

                buildFontGrid('');
            };
            xhr.send();
        }

        buildFontGrid('');
        loadCustomFonts();

        // Auto-focus text input on load
        setTimeout(() => {
            if (currentMode === 'text') {
                document.getElementById('textInput').focus();
            }
        }, 100);
    </script>
</body>
</html>
