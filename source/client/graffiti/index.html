<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graffiti Canvas</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        *:not(input):not(textarea):not(#graffitiCanvas) {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div class="graffiti-container">
        <div class="graffiti-title">&#x1F3A8; SPRAY GRAFFITI</div>

        <!-- MODE TABS -->
        <div class="mode-tabs">
            <button class="mode-tab active" id="tabText">&#x1F4DD; TEXT</button>
            <button class="mode-tab" id="tabDraw">&#x270F;&#xFE0F; DESEN</button>
        </div>

        <!-- COLOR PALETTE (shared by both modes) -->
        <div class="toolbar">
            <div class="toolbar-section">
                <label>Culori</label>
                <div class="color-btn active" style="background:#FFFFFF" data-color="#FFFFFF"></div>
                <div class="color-btn" style="background:#000000; border-color: #333;" data-color="#000000"></div>
                <div class="color-btn" style="background:#FF0000" data-color="#FF0000"></div>
                <div class="color-btn" style="background:#FF6600" data-color="#FF6600"></div>
                <div class="color-btn" style="background:#FFFF00" data-color="#FFFF00"></div>
                <div class="color-btn" style="background:#00FF00" data-color="#00FF00"></div>
                <div class="color-btn" style="background:#00FFFF" data-color="#00FFFF"></div>
                <div class="color-btn" style="background:#0088FF" data-color="#0088FF"></div>
                <div class="color-btn" style="background:#0000FF" data-color="#0000FF"></div>
                <div class="color-btn" style="background:#8800FF" data-color="#8800FF"></div>
                <div class="color-btn" style="background:#FF00FF" data-color="#FF00FF"></div>
                <div class="color-btn" style="background:#FF88AA" data-color="#FF88AA"></div>
                <div class="color-btn" style="background:#8B4513" data-color="#8B4513"></div>
                <div class="color-btn" style="background:#808080" data-color="#808080"></div>
                <input type="color" id="colorPicker" value="#00FF88" title="Custom color">
            </div>
        </div>

        <!-- TEXT MODE PANEL -->
        <div id="textPanel" class="mode-panel">
            <div class="toolbar">
                <div class="toolbar-section" style="flex:1">
                    <label>Text</label>
                    <textarea id="textInput" class="text-input" placeholder="Scrie textul... (Enter = linie noua)" rows="3" maxlength="500"></textarea>
                </div>
            </div>
            <div class="toolbar">
                <div class="toolbar-section">
                    <label>Font</label>
                    <div class="font-dropdown" id="fontDropdown">
                        <div class="font-dropdown-selected" id="fontSelected">
                            <span class="font-preview-text" style="font-family: Impact">Impact</span>
                            <span class="font-dropdown-arrow">&#9660;</span>
                        </div>
                        <div class="font-dropdown-list" id="fontList"></div>
                    </div>
                    <input type="hidden" id="fontSelect" value="Impact">
                </div>
                <div class="toolbar-section">
                    <label>Stil</label>
                    <button class="tool-btn" id="btnBold">&#x1D401; Bold</button>
                    <button class="tool-btn" id="btnItalic">&#x1D43C; Italic</button>
                    <button class="tool-btn" id="btnOutline">&#x2B1C; Outline</button>
                    <button class="tool-btn" id="btnShadow">&#x1F4A8; Shadow</button>
                </div>
            </div>
            <div class="stamp-info">Click pe canvas = Plaseaza text &bull; Right Click + Drag = Roteste &bull; Scroll = Marime</div>
        </div>

        <!-- DRAW MODE PANEL -->
        <div id="drawPanel" class="mode-panel" style="display:none">
        <div class="toolbar">
            <div class="toolbar-section">
                <label>Marime</label>
                <button class="size-btn" data-size="3">3</button>
                <button class="size-btn" data-size="6">6</button>
                <button class="size-btn active" data-size="12">12</button>
                <button class="size-btn" data-size="24">24</button>
                <button class="size-btn" data-size="40">40</button>
            </div>
            <div class="toolbar-section">
                <label>Unelte</label>
                <button class="tool-btn active" id="btnBrush">&#x1F58C; Brush</button>
                <button class="tool-btn" id="btnSpray">&#x1F4A8; Spray</button>
                <button class="tool-btn" id="btnEraser">&#x1F9F9; Eraser</button>
                <button class="tool-btn" id="btnFill">&#x1FAA3; Fill</button>
            </div>
            <div class="toolbar-section">
                <button class="tool-btn" id="btnUndo">&#x21A9; Undo</button>
                <button class="tool-btn" id="btnClear">&#x1F5D1; Clear</button>
                <button class="tool-btn" id="btnImgUrl">&#x1F310; URL</button>
            </div>
        </div>
        </div><!-- /drawPanel -->

        <!-- PREVIEW SIZE CONTROLS -->
        <div class="toolbar" id="previewSizeBar">
            <div class="toolbar-section">
                <label>Latime 3D</label>
                <input type="range" id="previewW" class="preview-slider" min="0.5" max="10" step="0.1" value="2.0">
                <span id="previewWVal" class="size-label">2.0</span>
            </div>
            <div class="toolbar-section">
                <label>Inaltime 3D</label>
                <input type="range" id="previewH" class="preview-slider" min="0.5" max="10" step="0.1" value="2.0">
                <span id="previewHVal" class="size-label">2.0</span>
            </div>
        </div>

        <!-- CANVAS -->
        <div class="canvas-wrapper">
            <canvas id="graffitiCanvas" width="512" height="512"></canvas>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="actions">
            <button class="btn-place" id="btnPlace">&#x2714; PLACE</button>
            <button class="btn-cancel" id="btnCancel">&#x2716; CANCEL</button>
        </div>

        <div class="info-text">Deseneaza graffiti-ul tau, apoi apasa PLACE pentru a-l plasa pe un perete.</div>
    </div>

    <!-- SPRAY CURSOR (visual indicator for brush size) -->
    <div class="spray-cursor" id="sprayCursor"></div>

    <!-- IMAGE URL MODAL -->
    <div class="url-modal-overlay" id="urlModal">
        <div class="url-modal">
            <div class="url-modal-title">&#x1F310; Importa Imagine din URL</div>
            <input type="text" id="urlInput" class="url-input" placeholder="https://i.imgur.com/example.png" spellcheck="false">
            <div class="url-status" id="urlStatus"></div>
            <div class="url-preview-wrap">
                <img id="urlPreview" class="url-preview">
            </div>
            <div class="url-actions">
                <button class="btn-place" id="btnUrlLoad">&#x2714; INCARCA</button>
                <button class="btn-cancel" id="btnUrlCancel">&#x2716; ANULEAZA</button>
            </div>
        </div>
    </div>

    <script>
        // ──────────────────────────────────────────
        // CANVAS SETUP
        // ──────────────────────────────────────────
        const canvas  = document.getElementById('graffitiCanvas');
        const ctx     = canvas.getContext('2d');
        const cursor  = document.getElementById('sprayCursor');

        // Start with transparent canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ──────────────────────────────────────────
        // STATE
        // ──────────────────────────────────────────
        let currentColor   = '#FFFFFF';
        let currentSize    = 12;
        let currentTool    = 'brush';   // brush | spray | eraser | fill
        let currentMode    = 'text';    // text | draw
        let isDrawing      = false;
        let lastX          = 0;
        let lastY          = 0;
        let historyStack   = [];
        const MAX_HISTORY  = 30;

        // Save initial state
        saveHistory();

        // ──────────────────────────────────────────
        // HISTORY (UNDO)
        // ──────────────────────────────────────────
        function saveHistory() {
            if (historyStack.length >= MAX_HISTORY) historyStack.shift();
            historyStack.push(canvas.toDataURL());
        }

        function undo() {
            if (historyStack.length <= 1) return;
            historyStack.pop(); // remove current
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.src = historyStack[historyStack.length - 1];
        }

        // ──────────────────────────────────────────
        // DRAWING
        // ──────────────────────────────────────────
        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function drawLine(x0, y0, x1, y1) {
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineWidth   = currentSize;
            ctx.lineCap     = 'round';
            ctx.lineJoin    = 'round';
            ctx.globalAlpha = 1.0;
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawSpray(x, y) {
            const density = Math.floor(currentSize * 2.5);
            const radius  = currentSize * 1.5;
            ctx.fillStyle = currentColor;
            for (let i = 0; i < density; i++) {
                const angle  = Math.random() * Math.PI * 2;
                const r      = Math.random() * radius;
                const dx     = Math.cos(angle) * r;
                const dy     = Math.sin(angle) * r;
                ctx.globalAlpha = Math.random() * 0.4 + 0.1;
                ctx.fillRect(x + dx, y + dy, 1.5, 1.5);
            }
            ctx.globalAlpha = 1.0;
        }

        // Flood fill
        function floodFill(startX, startY, fillColor) {
            startX = Math.floor(startX);
            startY = Math.floor(startY);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data      = imageData.data;
            const w         = canvas.width;
            const h         = canvas.height;

            const targetIdx  = (startY * w + startX) * 4;
            const targetR    = data[targetIdx];
            const targetG    = data[targetIdx + 1];
            const targetB    = data[targetIdx + 2];
            const targetA    = data[targetIdx + 3];

            // Parse fill color
            const tempC  = document.createElement('canvas').getContext('2d');
            tempC.fillStyle = fillColor;
            tempC.fillRect(0, 0, 1, 1);
            const fc = tempC.getImageData(0, 0, 1, 1).data;

            if (targetR === fc[0] && targetG === fc[1] && targetB === fc[2] && targetA === fc[3]) return;

            const tolerance = 20;
            const stack = [[startX, startY]];
            const visited = new Uint8Array(w * h);

            function matches(idx) {
                return Math.abs(data[idx] - targetR) <= tolerance &&
                       Math.abs(data[idx + 1] - targetG) <= tolerance &&
                       Math.abs(data[idx + 2] - targetB) <= tolerance &&
                       Math.abs(data[idx + 3] - targetA) <= tolerance;
            }

            while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                const pi = cy * w + cx;
                if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
                if (visited[pi]) continue;
                const idx = pi * 4;
                if (!matches(idx)) continue;

                visited[pi] = 1;
                data[idx]     = fc[0];
                data[idx + 1] = fc[1];
                data[idx + 2] = fc[2];
                data[idx + 3] = 255;

                stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
            }

            ctx.putImageData(imageData, 0, 0);
        }

        // ──────────────────────────────────────────
        // TEXT STAMP STATE
        // ──────────────────────────────────────────
        let stampScale    = 1.0;
        let stampRotation = 0;
        let stampMouseX   = canvas.width / 2;
        let stampMouseY   = canvas.height / 2;
        let stampImage    = null; // offscreen rendered text image

        // Drag-to-rotate state
        let isRotating      = false;
        let rotateAnchorX   = 0;
        let rotateAnchorY   = 0;
        let rotateBaseAngle = 0;

        function generateStampImage() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) { stampImage = null; return; }

            const font = document.getElementById('fontSelect').value;
            const baseFontSize = 80;

            let fontStyle = '';
            if (textBold) fontStyle += 'bold ';
            if (textItalic) fontStyle += 'italic ';

            const fullFont = fontStyle + baseFontSize + 'px "' + font + '"';

            // Measure and wrap text to fit within canvas
            const measureCtx = document.createElement('canvas').getContext('2d');
            measureCtx.font = fullFont;

            const maxWidth = 480;
            const paragraphs = text.split('\n');
            const lines = [];
            for (const para of paragraphs) {
                if (!para.length) { lines.push(''); continue; }
                const words = para.split(' ');
                let currentLine = '';
                for (const word of words) {
                    const testLine = currentLine ? currentLine + ' ' + word : word;
                    if (measureCtx.measureText(testLine).width > maxWidth && currentLine) {
                        lines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                }
                if (currentLine) lines.push(currentLine);
            }
            if (lines.length === 0) lines.push('');

            const lineHeight = baseFontSize * 1.2;
            let maxW = 0;
            for (const line of lines) {
                const w = measureCtx.measureText(line).width;
                if (w > maxW) maxW = w;
            }

            const pad = Math.ceil(baseFontSize * 0.4);
            const cw = Math.ceil(maxW) + pad * 2;
            const ch = Math.ceil(lines.length * lineHeight) + pad * 2;

            const offCanvas = document.createElement('canvas');
            offCanvas.width = cw;
            offCanvas.height = ch;
            const offCtx = offCanvas.getContext('2d');

            offCtx.font = fullFont;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';

            if (textShadow) {
                offCtx.shadowColor = 'rgba(0,0,0,0.7)';
                offCtx.shadowBlur = 8;
                offCtx.shadowOffsetX = 4;
                offCtx.shadowOffsetY = 4;
            }

            for (let i = 0; i < lines.length; i++) {
                const y = pad + lineHeight / 2 + i * lineHeight;
                if (textOutline) {
                    offCtx.strokeStyle = '#000000';
                    offCtx.lineWidth = Math.max(2, baseFontSize / 12);
                    offCtx.lineJoin = 'round';
                    offCtx.strokeText(lines[i], cw / 2, y);
                }
                offCtx.fillStyle = currentColor;
                offCtx.fillText(lines[i], cw / 2, y);
            }

            offCtx.shadowColor = 'transparent';
            stampImage = offCanvas;
        }

        function renderCanvasWithStampPreview() {
            // Redraw canvas from last saved history state
            if (historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    drawStampGhost();
                };
                img.src = historyStack[historyStack.length - 1];
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawStampGhost();
            }
        }

        function drawStampGhost() {
            if (!stampImage || currentMode !== 'text') return;

            ctx.save();
            ctx.translate(stampMouseX, stampMouseY);
            ctx.rotate(stampRotation);
            ctx.scale(stampScale, stampScale);
            ctx.globalAlpha = 0.6;
            ctx.drawImage(stampImage, -stampImage.width / 2, -stampImage.height / 2);
            ctx.restore();
        }

        function placeStamp() {
            if (!stampImage || currentMode !== 'text') return;

            // Restore canvas to last clean state, then stamp permanently
            if (historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);

                    ctx.save();
                    ctx.translate(stampMouseX, stampMouseY);
                    ctx.rotate(stampRotation);
                    ctx.scale(stampScale, stampScale);
                    ctx.globalAlpha = 1.0;
                    ctx.drawImage(stampImage, -stampImage.width / 2, -stampImage.height / 2);
                    ctx.restore();

                    saveHistory();
                    renderCanvasWithStampPreview();
                };
                img.src = historyStack[historyStack.length - 1];
            } else {
                ctx.save();
                ctx.translate(stampMouseX, stampMouseY);
                ctx.rotate(stampRotation);
                ctx.scale(stampScale, stampScale);
                ctx.globalAlpha = 1.0;
                ctx.drawImage(stampImage, -stampImage.width / 2, -stampImage.height / 2);
                ctx.restore();

                saveHistory();
                renderCanvasWithStampPreview();
            }
        }

        // ──────────────────────────────────────────
        // MOUSE EVENTS
        // ──────────────────────────────────────────
        canvas.addEventListener('mousedown', (e) => {
            if (currentMode === 'text') {
                if (e.button === 0) {
                    // Left click → place stamp
                    placeStamp();
                } else if (e.button === 2) {
                    // Right click → start drag-to-rotate
                    isRotating = true;
                    const pos = getCanvasPos(e);
                    rotateAnchorX = pos.x;
                    rotateAnchorY = pos.y;
                    rotateBaseAngle = stampRotation;
                }
                return;
            }

            const pos = getCanvasPos(e);

            if (currentTool === 'fill') {
                saveHistory();
                floodFill(pos.x, pos.y, currentColor);
                return;
            }

            isDrawing = true;
            lastX = pos.x;
            lastY = pos.y;

            if (currentTool === 'spray') {
                drawSpray(pos.x, pos.y);
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (currentMode === 'text') {
                cursor.style.display = 'none';
                const pos = getCanvasPos(e);
                if (isRotating) {
                    const dx = pos.x - rotateAnchorX;
                    const dy = pos.y - rotateAnchorY;
                    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                        stampRotation = rotateBaseAngle + Math.atan2(dy, dx);
                    }
                } else {
                    stampMouseX = pos.x;
                    stampMouseY = pos.y;
                }
                renderCanvasWithStampPreview();
                return;
            }
            // Update custom cursor position
            cursor.style.left   = e.clientX + 'px';
            cursor.style.top    = e.clientY + 'px';
            cursor.style.width  = currentSize * 2 + 'px';
            cursor.style.height = currentSize * 2 + 'px';
            cursor.style.display = 'block';

            if (!isDrawing) return;
            const pos = getCanvasPos(e);

            if (currentTool === 'spray') {
                drawSpray(pos.x, pos.y);
            } else {
                drawLine(lastX, lastY, pos.x, pos.y);
            }

            lastX = pos.x;
            lastY = pos.y;
        });

        canvas.addEventListener('wheel', (e) => {
            if (currentMode !== 'text') return;
            e.preventDefault();
            if (e.deltaY < 0) {
                stampScale = Math.min(stampScale + 0.1, 5.0);
            } else {
                stampScale = Math.max(stampScale - 0.1, 0.2);
            }
            renderCanvasWithStampPreview();
        }, { passive: false });

        canvas.addEventListener('mouseup', (e) => {
            if (currentMode === 'text' && e.button === 2) {
                isRotating = false;
                return;
            }
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (isDrawing) {
                isDrawing = false;
                saveHistory();
            }
            isRotating = false;
            cursor.style.display = 'none';
            // In text mode, restore clean canvas (remove ghost stamp)
            if (currentMode === 'text' && historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = historyStack[historyStack.length - 1];
            }
        });

        // ──────────────────────────────────────────
        // COLOR BUTTONS
        // ──────────────────────────────────────────
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
                if (currentTool === 'eraser') {
                    currentTool = 'brush';
                    updateToolButtons();
                }
                generateStampImage();
                renderCanvasWithStampPreview();
            });
        });

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            currentColor = e.target.value;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            if (currentTool === 'eraser') {
                currentTool = 'brush';
                updateToolButtons();
            }
            generateStampImage();
            renderCanvasWithStampPreview();
        });

        // ──────────────────────────────────────────
        // SIZE BUTTONS
        // ──────────────────────────────────────────
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSize = parseInt(btn.dataset.size);
            });
        });

        // ──────────────────────────────────────────
        // TOOL BUTTONS
        // ──────────────────────────────────────────
        function updateToolButtons() {
            document.querySelectorAll('#btnBrush, #btnSpray, #btnEraser, #btnFill')
                .forEach(b => b.classList.remove('active'));

            if (currentTool === 'brush')  document.getElementById('btnBrush').classList.add('active');
            if (currentTool === 'spray')  document.getElementById('btnSpray').classList.add('active');
            if (currentTool === 'eraser') document.getElementById('btnEraser').classList.add('active');
            if (currentTool === 'fill')   document.getElementById('btnFill').classList.add('active');

            canvas.style.cursor = currentTool === 'fill' ? 'cell' : 'crosshair';
        }

        document.getElementById('btnBrush').addEventListener('click', () => { currentTool = 'brush'; updateToolButtons(); });
        document.getElementById('btnSpray').addEventListener('click', () => { currentTool = 'spray'; updateToolButtons(); });
        document.getElementById('btnEraser').addEventListener('click', () => { currentTool = 'eraser'; updateToolButtons(); });
        document.getElementById('btnFill').addEventListener('click', () => { currentTool = 'fill'; updateToolButtons(); });

        document.getElementById('btnUndo').addEventListener('click', undo);

        document.getElementById('btnClear').addEventListener('click', () => {
            saveHistory();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // ──────────────────────────────────────────
        // IMAGE URL IMPORT
        // ──────────────────────────────────────────
        const urlModal   = document.getElementById('urlModal');
        const urlInput   = document.getElementById('urlInput');
        const urlStatus  = document.getElementById('urlStatus');
        const urlPreview = document.getElementById('urlPreview');

        const ALLOWED_HOSTS = [
            'i.imgur.com', 'imgur.com',
            'i.ibb.co', 'ibb.co',
            'upload.wikimedia.org',
            'i.redd.it', 'preview.redd.it',
            'cdn.discordapp.com', 'media.discordapp.net',
            'pbs.twimg.com',
            'i.pinimg.com'
        ];

        function isAllowedImageUrl(url) {
            try {
                const u = new URL(url);
                if (u.protocol !== 'https:') return { ok: false, reason: 'Doar HTTPS este permis.' };
                const host = u.hostname.toLowerCase();
                const allowed = ALLOWED_HOSTS.some(h => host === h || host.endsWith('.' + h));
                if (!allowed) return { ok: false, reason: 'Host nepermis. Foloseste: imgur, ibb, discord, reddit, etc.' };
                const ext = u.pathname.toLowerCase();
                const validExt = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp'];
                const hasValidExt = validExt.some(e => ext.endsWith(e));
                if (!hasValidExt) return { ok: false, reason: 'URL-ul trebuie sa fie o imagine (.png, .jpg, .gif, .webp).' };
                return { ok: true };
            } catch (e) {
                return { ok: false, reason: 'URL invalid.' };
            }
        }

        function showUrlModal() {
            urlModal.style.display = 'flex';
            urlInput.value = '';
            urlStatus.textContent = '';
            urlStatus.className = 'url-status';
            urlPreview.style.display = 'none';
            urlInput.focus();
        }

        function hideUrlModal() {
            urlModal.style.display = 'none';
        }

        document.getElementById('btnImgUrl').addEventListener('click', showUrlModal);
        document.getElementById('btnUrlCancel').addEventListener('click', hideUrlModal);

        urlInput.addEventListener('input', () => {
            const val = urlInput.value.trim();
            if (!val) {
                urlStatus.textContent = '';
                urlPreview.style.display = 'none';
                return;
            }
            const check = isAllowedImageUrl(val);
            if (!check.ok) {
                urlStatus.textContent = check.reason;
                urlStatus.className = 'url-status url-error';
                urlPreview.style.display = 'none';
                return;
            }
            urlStatus.textContent = 'Se incarca previzualizarea...';
            urlStatus.className = 'url-status url-loading';
            urlPreview.style.display = 'none';

            const testImg = new Image();
            testImg.crossOrigin = 'anonymous';
            testImg.onload = () => {
                urlPreview.src = val;
                urlPreview.style.display = 'block';
                urlStatus.textContent = 'Imagine valida! Apasa INCARCA.';
                urlStatus.className = 'url-status url-ok';
            };
            testImg.onerror = () => {
                urlStatus.textContent = 'Nu se poate incarca imaginea. Verifica URL-ul.';
                urlStatus.className = 'url-status url-error';
                urlPreview.style.display = 'none';
            };
            testImg.src = val;
        });

        document.getElementById('btnUrlLoad').addEventListener('click', () => {
            const val = urlInput.value.trim();
            const check = isAllowedImageUrl(val);
            if (!check.ok) {
                urlStatus.textContent = check.reason;
                urlStatus.className = 'url-status url-error';
                return;
            }
            if (urlPreview.style.display === 'none') {
                urlStatus.textContent = 'Asteapta sa se incarce imaginea.';
                urlStatus.className = 'url-status url-error';
                return;
            }
            saveHistory();
            const loadImg = new Image();
            loadImg.crossOrigin = 'anonymous';
            loadImg.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(loadImg, 0, 0, canvas.width, canvas.height);
                saveHistory();
                hideUrlModal();
            };
            loadImg.onerror = () => {
                urlStatus.textContent = 'Eroare la incarcarea imaginii.';
                urlStatus.className = 'url-status url-error';
            };
            loadImg.src = val;
        });

        urlModal.addEventListener('click', (e) => {
            if (e.target === urlModal) hideUrlModal();
        });

        // ──────────────────────────────────────────
        // ACTION BUTTONS
        // ──────────────────────────────────────────
        document.getElementById('btnPlace').addEventListener('click', () => {
            function doExport() {
                const MAX_DATA_SIZE = 2000000; // ~2MB max for network transfer

                // Check if canvas has any transparent pixels
                const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let hasTransparency = false;
                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] < 250) { hasTransparency = true; break; }
                }

                let dataURL;
                if (hasTransparency) {
                    // PNG to preserve transparency
                    dataURL = canvas.toDataURL('image/png');
                    // If PNG too large, resize
                    if (dataURL.length > MAX_DATA_SIZE) {
                        const small = document.createElement('canvas');
                        small.width = 256;
                        small.height = 256;
                        small.getContext('2d').drawImage(canvas, 0, 0, 256, 256);
                        dataURL = small.toDataURL('image/png');
                    }
                } else {
                    // JPEG for fully opaque images (photos) — much smaller
                    let quality = 0.85;
                    dataURL = canvas.toDataURL('image/jpeg', quality);
                    while (dataURL.length > MAX_DATA_SIZE && quality > 0.2) {
                        quality -= 0.1;
                        dataURL = canvas.toDataURL('image/jpeg', quality);
                    }
                    if (dataURL.length > MAX_DATA_SIZE) {
                        const small = document.createElement('canvas');
                        small.width = 256;
                        small.height = 256;
                        small.getContext('2d').drawImage(canvas, 0, 0, 256, 256);
                        dataURL = small.toDataURL('image/jpeg', 0.7);
                    }
                }

                sendChunkedToClient(dataURL);
            }

            // In text mode, restore clean canvas from history (remove ghost stamp overlay)
            if (currentMode === 'text' && historyStack.length > 0) {
                const cleanImg = new Image();
                cleanImg.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(cleanImg, 0, 0);
                    doExport();
                };
                cleanImg.src = historyStack[historyStack.length - 1];
                return;
            }

            doExport();
        });

        document.getElementById('btnCancel').addEventListener('click', () => {
            mp.trigger('Graffiti_CanvasCancel');
        });

        // ──────────────────────────────────────────
        // CHUNKED EXPORT TO CLIENT (avoids mp.trigger size limits)
        // ──────────────────────────────────────────
        function sendChunkedToClient(dataURL) {
            const pw = document.getElementById('previewW').value;
            const ph = document.getElementById('previewH').value;
            const CHUNK = 25000;
            const total = Math.ceil(dataURL.length / CHUNK);
            mp.trigger('Graffiti_CanvasStart', '' + total, pw, ph);
            for (let i = 0; i < total; i++) {
                mp.trigger('Graffiti_CanvasChunk', '' + i, dataURL.substring(i * CHUNK, (i + 1) * CHUNK));
            }
        }

        // ──────────────────────────────────────────
        // KEYBOARD SHORTCUTS
        // ──────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (currentMode === 'text') {
                if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); renderCanvasWithStampPreview(); }
                return;
            }
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
            if (e.key === 'b') { currentTool = 'brush'; updateToolButtons(); }
            if (e.key === 's') { currentTool = 'spray'; updateToolButtons(); }
            if (e.key === 'e') { currentTool = 'eraser'; updateToolButtons(); }
            if (e.key === 'f') { currentTool = 'fill'; updateToolButtons(); }
        });

        // ──────────────────────────────────────────
        // MODE SWITCHING (TEXT / DRAW)
        // ──────────────────────────────────────────
        let textBold = false;
        let textItalic = false;
        let textOutline = false;
        let textShadow = false;

        document.getElementById('tabText').addEventListener('click', () => {
            currentMode = 'text';
            document.getElementById('tabText').classList.add('active');
            document.getElementById('tabDraw').classList.remove('active');
            document.getElementById('textPanel').style.display = '';
            document.getElementById('drawPanel').style.display = 'none';
            canvas.style.cursor = 'crosshair';
            generateStampImage();
            renderCanvasWithStampPreview();
            setTimeout(() => document.getElementById('textInput').focus(), 50);
        });

        document.getElementById('tabDraw').addEventListener('click', () => {
            currentMode = 'draw';
            document.getElementById('tabDraw').classList.add('active');
            document.getElementById('tabText').classList.remove('active');
            document.getElementById('drawPanel').style.display = '';
            document.getElementById('textPanel').style.display = 'none';
            // Restore canvas to clean state (remove ghost stamp)
            if (historyStack.length > 0) {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = historyStack[historyStack.length - 1];
            }
        });

        // Text controls event listeners
        document.getElementById('textInput').addEventListener('input', () => {
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        // fontSelect change is handled by the custom dropdown selectFont()

        document.getElementById('btnBold').addEventListener('click', () => {
            textBold = !textBold;
            document.getElementById('btnBold').classList.toggle('active', textBold);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnItalic').addEventListener('click', () => {
            textItalic = !textItalic;
            document.getElementById('btnItalic').classList.toggle('active', textItalic);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnOutline').addEventListener('click', () => {
            textOutline = !textOutline;
            document.getElementById('btnOutline').classList.toggle('active', textOutline);
            generateStampImage();
            renderCanvasWithStampPreview();
        });
        document.getElementById('btnShadow').addEventListener('click', () => {
            textShadow = !textShadow;
            document.getElementById('btnShadow').classList.toggle('active', textShadow);
            generateStampImage();
            renderCanvasWithStampPreview();
        });

        // Preview size slider listeners — also resize the canvas
        document.getElementById('previewW').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('previewWVal').textContent = val.toFixed(1);
            const hVal = parseFloat(document.getElementById('previewH').value);
            resizeCanvasPreview(val, hVal);
        });
        document.getElementById('previewH').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('previewHVal').textContent = val.toFixed(1);
            const wVal = parseFloat(document.getElementById('previewW').value);
            resizeCanvasPreview(wVal, val);
        });

        function resizeCanvasPreview(w, h) {
            // Save current canvas content
            const imgData = canvas.toDataURL();
            const ratio = w / h;
            // Base dimension: keep the larger side at 512
            let newW, newH;
            if (ratio >= 1) {
                newW = 512;
                newH = Math.round(512 / ratio);
            } else {
                newH = 512;
                newW = Math.round(512 * ratio);
            }
            newW = Math.max(64, newW);
            newH = Math.max(64, newH);
            canvas.width = newW;
            canvas.height = newH;
            // Restore content
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, newW, newH);
                ctx.drawImage(img, 0, 0, newW, newH);
                // Update history with new size
                historyStack = [canvas.toDataURL()];
            };
            img.src = imgData;
        }

        // ──────────────────────────────────────────
        // CUSTOM FONT DROPDOWN
        // ──────────────────────────────────────────
        const builtinFonts = [
            { name: 'Impact', family: 'Impact' },
            { name: 'Arial Black', family: 'Arial Black' },
            { name: 'Comic Sans', family: 'Comic Sans MS' },
            { name: 'Segoe Script', family: 'Segoe Script' },
            { name: 'Georgia', family: 'Georgia' },
            { name: 'Courier', family: 'Courier New' },
            { name: 'Verdana', family: 'Verdana' },
            { name: 'Trebuchet', family: 'Trebuchet MS' },
            { name: 'Lucida Console', family: 'Lucida Console' },
            { name: 'Times New Roman', family: 'Times New Roman' }
        ];

        let allFonts = [...builtinFonts];
        let selectedFont = 'Impact';

        const fontDropdown = document.getElementById('fontDropdown');
        const fontSelected = document.getElementById('fontSelected');
        const fontList = document.getElementById('fontList');
        const fontSelect = document.getElementById('fontSelect');

        function buildFontList() {
            fontList.innerHTML = '';
            allFonts.forEach(f => {
                const item = document.createElement('div');
                item.className = 'font-dropdown-item' + (f.family === selectedFont ? ' active' : '');
                item.dataset.family = f.family;
                item.innerHTML = '<span class="font-preview-text" style="font-family: \'' + f.family + '\'">' + f.name + '</span>';
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectFont(f.family, f.name);
                });
                fontList.appendChild(item);
            });
        }

        function selectFont(family, name) {
            selectedFont = family;
            fontSelect.value = family;
            fontSelected.innerHTML = '<span class="font-preview-text" style="font-family: \'' + family + '\'">' + name + '</span><span class="font-dropdown-arrow">&#9660;</span>';
            fontDropdown.classList.remove('open');
            buildFontList();
            generateStampImage();
            renderCanvasWithStampPreview();
        }

        fontSelected.addEventListener('click', (e) => {
            e.stopPropagation();
            fontDropdown.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!fontDropdown.contains(e.target)) {
                fontDropdown.classList.remove('open');
            }
        });

        // Load custom fonts from fonts/fonts.json
        function loadCustomFonts() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'fonts/fonts.json', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState !== 4) return;
                if (xhr.status !== 200 && xhr.responseText === '') {
                    console.warn('fonts.json not found or empty');
                    return;
                }
                let data;
                try { data = JSON.parse(xhr.responseText); } catch(e) { console.warn('fonts.json parse error', e); return; }
                if (!data.fonts || !data.fonts.length) return;

                // Build @font-face CSS rules
                let css = '';
                data.fonts.forEach(f => {
                    css += '@font-face { font-family: "' + f.name + '"; src: url("fonts/' + f.file + '"); font-display: block; }\n';
                });
                const style = document.createElement('style');
                style.textContent = css;
                document.head.appendChild(style);

                // Add fonts to the list
                data.fonts.forEach(f => {
                    allFonts.push({ name: f.name, family: f.name });
                });

                // Wait for fonts to actually load, then rebuild
                document.fonts.ready.then(() => {
                    buildFontList();
                });

                // Also rebuild immediately so they show up (they'll render with correct font once loaded)
                buildFontList();
            };
            xhr.send();
        }

        buildFontList();
        loadCustomFonts();

        // Auto-focus text input on load
        setTimeout(() => {
            if (currentMode === 'text') {
                document.getElementById('textInput').focus();
            }
        }, 100);
    </script>
</body>
</html>
