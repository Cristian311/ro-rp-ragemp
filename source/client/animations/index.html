* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; user-select: none; }

#animMenu {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    max-height: 75vh;
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid rgba(255, 200, 50, 0.3);
    border-radius: 12px;
    overflow: hidden;
    flex-direction: column;
}
#animMenu.visible { display: flex; }

.menu-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid rgba(255, 200, 50, 0.15);
}
.menu-header h2 {
    color: #FFD700;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
}

#searchBox {
    width: 100%;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    outline: none;
}
#searchBox::placeholder { color: rgba(255, 255, 255, 0.35); }
#searchBox:focus { border-color: rgba(255, 200, 50, 0.5); }

.menu-body {
    overflow-y: auto;
    padding: 8px 12px 12px;
    flex: 1;
}
.menu-body::-webkit-scrollbar { width: 5px; }
.menu-body::-webkit-scrollbar-track { background: transparent; }
.menu-body::-webkit-scrollbar-thumb { background: rgba(255, 200, 50, 0.3); border-radius: 3px; }

.category {
    margin-bottom: 6px;
}
.cat-header {
    padding: 8px 12px;
    color: #FFD700;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 6px;
    transition: background 0.15s;
}
.cat-header:hover { background: rgba(255, 200, 50, 0.08); }
.cat-header .arrow { transition: transform 0.2s; font-size: 10px; }
.cat-header .arrow.open { transform: rotate(90deg); }
.cat-header .count {
    margin-left: auto;
    color: rgba(255, 255, 255, 0.3);
    font-size: 11px;
    font-weight: 400;
}

.cat-items {
    display: none;
    padding: 2px 0 4px 8px;
    flex-wrap: wrap;
    gap: 4px;
}
.cat-items.open { display: flex; }

.anim-btn {
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    color: #ddd;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
}
.anim-btn:hover {
    background: rgba(255, 200, 50, 0.15);
    border-color: rgba(255, 200, 50, 0.4);
    color: #FFD700;
}
.anim-btn.active {
    background: rgba(255, 200, 50, 0.2);
    border-color: #FFD700;
    color: #FFD700;
}

.menu-footer {
    padding: 10px 16px;
    border-top: 1px solid rgba(255, 200, 50, 0.15);
    color: rgba(255, 255, 255, 0.35);
    font-size: 11px;
    text-align: center;
}

.hidden { display: none !important; }
</style>

let currentActive = null;

function buildMenu() {
    const body = document.getElementById('menuBody');
    body.innerHTML = '';

    for (const [catName, anims] of Object.entries(ANIMS)) {
        const cat = document.createElement('div');
        cat.className = 'category';
        cat.dataset.category = catName;

        const header = document.createElement('div');
        header.className = 'cat-header';
        header.innerHTML = `<span class="arrow">▶</span> ${catName} <span class="count">${anims.length}</span>`;
        header.onclick = () => {
            const items = cat.querySelector('.cat-items');
            const arrow = header.querySelector('.arrow');
            items.classList.toggle('open');
            arrow.classList.toggle('open');
        };

        const items = document.createElement('div');
        items.className = 'cat-items';

        anims.forEach(a => {
            const btn = document.createElement('div');
            btn.className = 'anim-btn';
            btn.textContent = a.name;
            btn.dataset.dict = a.dict;
            btn.dataset.anim = a.anim;
            btn.dataset.name = a.name;
            btn.onclick = () => {
                if (currentActive) currentActive.classList.remove('active');
                btn.classList.add('active');
                currentActive = btn;
                mp.trigger('animations:playFromMenu', a.dict, a.anim, a.name);
            };
            items.appendChild(btn);
        });

        cat.appendChild(header);
        cat.appendChild(items);
        body.appendChild(cat);
    }
}

function filterAnims(query) {
    query = query.toLowerCase().trim();
    const cats = document.querySelectorAll('.category');

    cats.forEach(cat => {
        const btns = cat.querySelectorAll('.anim-btn');
        let visibleCount = 0;

        btns.forEach(btn => {
            const match = btn.dataset.name.toLowerCase().includes(query) ||
                          btn.dataset.dict.toLowerCase().includes(query);
            btn.classList.toggle('hidden', !match);
            if (match) visibleCount++;
        });

        cat.classList.toggle('hidden', visibleCount === 0);

        // Auto-open categories when searching
        if (query.length > 0 && visibleCount > 0) {
            cat.querySelector('.cat-items').classList.add('open');
            cat.querySelector('.arrow').classList.add('open');
        } else if (query.length === 0) {
            cat.querySelector('.cat-items').classList.remove('open');
            cat.querySelector('.arrow').classList.remove('open');
        }

        // Update count
        cat.querySelector('.count').textContent = visibleCount;
    });
}

document.addEventListener('DOMContentLoaded', () => {
    buildMenu();
    document.getElementById('searchBox').addEventListener('input', (e) => {
        filterAnims(e.target.value);
    });
});

function openMenu() {
    document.getElementById('animMenu').classList.add('visible');
    document.getElementById('searchBox').value = '';
    filterAnims('');
    document.getElementById('searchBox').focus();
}

function closeMenu() {
    document.getElementById('animMenu').classList.remove('visible');
}
