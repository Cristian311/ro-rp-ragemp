<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: transparent;
        font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        color: #e0e0e0;
        overflow: hidden;
        user-select: none;
    }

    #alpr-container {
        position: fixed;
        bottom: 1.042vw;
        right: 1.042vw;
        width: 21.875vw;
        background: linear-gradient(135deg, rgba(15, 18, 30, 0.92) 0%, rgba(20, 25, 45, 0.95) 100%);
        border: 0.052vw solid rgba(255, 255, 255, 0.08);
        border-radius: 0.729vw;
        backdrop-filter: blur(0.833vw);
        box-shadow: 0 0.417vw 1.667vw rgba(0, 0, 0, 0.5), 0 0 0 0.052vw rgba(255, 255, 255, 0.05) inset;
        display: none;
        overflow: hidden;
        /* Draggable: switch to top/left positioning */
        top: auto;
        left: auto;
    }

    #alpr-container.visible { display: block; }

    /* Header */
    .alpr-header {
        padding: 0.833vw 1.042vw 0.625vw;
        border-bottom: 0.052vw solid rgba(255, 255, 255, 0.06);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        cursor: grab;
    }
    .alpr-header:active { cursor: grabbing; }
    .alpr-title-row {
        display: flex;
        align-items: center;
        gap: 0.521vw;
    }
    .alpr-dot {
        width: 0.521vw; height: 0.521vw;
        border-radius: 50%;
        background: #3b82f6;
        box-shadow: 0 0 0.417vw rgba(59, 130, 246, 0.6);
        animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .alpr-title {
        font-size: 0.938vw;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.104vw;
    }
    .alpr-subtitle {
        font-size: 0.573vw;
        color: #6b7280;
        margin-top: 0.104vw;
    }
    .speed-display {
        text-align: right;
    }
    .speed-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.458vw;
        font-weight: 700;
        color: #f0f0f0;
        line-height: 1;
    }
    .speed-unit {
        font-size: 0.573vw;
        color: #6b7280;
        font-weight: 500;
        letter-spacing: 0.052vw;
    }

    /* Plate Section */
    .plate-section {
        padding: 0.729vw 1.042vw;
        border-bottom: 0.052vw solid rgba(255, 255, 255, 0.06);
    }
    .plate-label {
        font-size: 0.521vw;
        font-weight: 600;
        color: #6b7280;
        letter-spacing: 0.104vw;
        text-transform: uppercase;
        margin-bottom: 0.208vw;
    }
    .plate-number {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.458vw;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.156vw;
    }
    .plate-badges {
        margin-top: 0.417vw;
        display: flex;
        flex-wrap: wrap;
        gap: 0.312vw;
    }
    .badge {
        display: inline-block;
        padding: 0.156vw 0.521vw;
        border-radius: 0.208vw;
        font-size: 0.573vw;
        font-weight: 700;
        letter-spacing: 0.026vw;
    }
    .badge-danger {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border: 0.052vw solid rgba(239, 68, 68, 0.3);
    }
    .badge-success {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
        border: 0.052vw solid rgba(34, 197, 94, 0.3);
    }
    .badge-warning {
        background: rgba(234, 179, 8, 0.2);
        color: #eab308;
        border: 0.052vw solid rgba(234, 179, 8, 0.3);
    }
    .badge-info {
        background: rgba(59, 130, 246, 0.2);
        color: #3b82f6;
        border: 0.052vw solid rgba(59, 130, 246, 0.3);
    }
    .badge-purple {
        background: rgba(168, 85, 247, 0.2);
        color: #a855f7;
        border: 0.052vw solid rgba(168, 85, 247, 0.3);
    }

    /* Info Grid */
    .info-grid {
        display: flex;
        gap: 0.052vw;
        margin: 0 0.833vw 0.625vw;
        background: rgba(255,255,255,0.04);
        border-radius: 0.521vw;
        overflow: hidden;
        border: 0.052vw solid rgba(255,255,255,0.06);
        margin-top: 0.625vw;
    }
    .info-card {
        flex: 1;
    }
    .info-card {
        background: rgba(15, 18, 30, 0.6);
        padding: 0.625vw 0.729vw;
    }
    .info-card-title {
        font-size: 0.573vw;
        font-weight: 700;
        color: #9ca3af;
        margin-bottom: 0.417vw;
        letter-spacing: 0.026vw;
    }
    .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.156vw 0;
    }
    .info-label {
        font-size: 0.625vw;
        color: #6b7280;
    }
    .info-value {
        font-size: 0.625vw;
        font-weight: 600;
        color: #e5e7eb;
        text-align: right;
    }



    /* Footer */
    .alpr-footer {
        padding: 0.521vw 1.042vw;
        border-top: 0.052vw solid rgba(255, 255, 255, 0.06);
        font-size: 0.573vw;
        color: #4b5563;
    }

    /* No target state */
    .no-target {
        padding: 2.083vw 1.042vw;
        text-align: center;
        color: #4b5563;
        font-size: 0.677vw;
    }
    .no-target .scan-icon {
        font-size: 1.875vw;
        margin-bottom: 0.521vw;
        opacity: 0.4;
    }

    /* Scanning state */
    .scanning-overlay {
        padding: 1.562vw 1.042vw;
        text-align: center;
        display: none;
    }
    .scanning-overlay.active { display: block; }
    .scanning-text {
        font-size: 0.781vw;
        font-weight: 700;
        color: #3b82f6;
        letter-spacing: 0.104vw;
        margin-bottom: 0.729vw;
        animation: scanning-pulse 1.2s infinite;
    }
    @keyframes scanning-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }
    .scan-progress-bar {
        width: 100%;
        height: 0.208vw;
        background: rgba(59, 130, 246, 0.15);
        border-radius: 0.104vw;
        overflow: hidden;
    }
    .scan-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        border-radius: 0.104vw;
        transition: width 0.2s linear;
        box-shadow: 0 0 0.417vw rgba(59, 130, 246, 0.5);
    }
    .scanning-sub {
        margin-top: 0.521vw;
        font-size: 0.573vw;
        color: #4b5563;
    }

    /* Scan animation */
    .scanning {
        position: relative;
    }
    .scanning::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 0.104vw;
        background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        animation: scan-line 2s infinite;
    }
    @keyframes scan-line {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }
</style>
</head>
<body>
<div id="alpr-container">
    <!-- Header -->
    <div class="alpr-header">
        <div>
            <div class="alpr-title-row">
                <div class="alpr-dot"></div>
                <span class="alpr-title">ALPR</span>
            </div>
            <div class="alpr-subtitle" id="lastScan">Ultima scanare: --:--:-- --</div>
        </div>
    </div>

    <!-- Content area -->
    <div id="alpr-content">
        <div class="no-target" id="noTarget">
            <div class="scan-icon">◎</div>
            <div>Se scaneaza... Indreapta vehiculul spre un alt vehicul.</div>
        </div>

        <div class="scanning-overlay" id="scanningOverlay">
            <div class="scanning-text">SCANNING...</div>
            <div class="scan-progress-bar"><div class="scan-progress-fill" id="scanProgressFill"></div></div>
            <div class="scanning-sub">Analiză vehicul detectat</div>
        </div>

        <div id="vehicleData" style="display:none;">
            <!-- Plate -->
            <div class="plate-section">
                <div class="plate-label">PLĂCUȚĂ</div>
                <div class="plate-number" id="plateNumber">---</div>
                <div class="plate-badges" id="badges"></div>
            </div>

            <!-- Info Grid -->
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-card-title">Vehicul</div>
                    <div class="info-row"><span class="info-label">Model</span><span class="info-value" id="vModel">-</span></div>
                    <div class="info-row"><span class="info-label">Culoare</span><span class="info-value" id="vColor">-</span></div>
                    <div class="info-row"><span class="info-label">VIN</span><span class="info-value" id="vVin">-</span></div>
                    <div class="info-row"><span class="info-label">An</span><span class="info-value" id="vYear">-</span></div>
                </div>
                <div class="info-card">
                    <div class="info-card-title">Proprietar</div>
                    <div class="info-row"><span class="info-label">Nume</span><span class="info-value" id="oName">-</span></div>
                    <div class="info-row"><span class="info-label">ID</span><span class="info-value" id="oId">-</span></div>
                    <div class="info-row"><span class="info-label">Permis</span><span class="info-value" id="oLicense">-</span></div>
                </div>
            </div>


        </div>
    </div>

    <div class="alpr-footer">Control: /alpr ON/OFF</div>
</div>

<script>
    const container = document.getElementById('alpr-container');
    const noTarget = document.getElementById('noTarget');
    const vehicleData = document.getElementById('vehicleData');
    const scanningOverlay = document.getElementById('scanningOverlay');
    const scanProgressFill = document.getElementById('scanProgressFill');

    function show() {
        container.classList.add('visible');
    }

    function hide() {
        container.classList.remove('visible');
        resetData();
    }

    function resetData() {
        noTarget.style.display = '';
        scanningOverlay.classList.remove('active');
        vehicleData.style.display = 'none';
        document.getElementById('lastScan').textContent = 'Ultima scanare: --:--:-- --';
        scanProgressFill.style.width = '0%';
    }

    function showScanning() {
        noTarget.style.display = 'none';
        vehicleData.style.display = 'none';
        scanningOverlay.classList.add('active');
        scanProgressFill.style.width = '0%';
    }

    function updateScanProgress(pct) {
        scanProgressFill.style.width = (pct * 100).toFixed(1) + '%';
    }

    function hideScanningBar() {
        scanningOverlay.classList.remove('active');
    }

    function updateScanTime() {
        const now = new Date();
        const h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        document.getElementById('lastScan').textContent =
            `Ultima scanare: ${h12}:${m}:${s} ${ampm}`;
    }

    function updateVehicleData(data) {
        noTarget.style.display = 'none';
        scanningOverlay.classList.remove('active');
        vehicleData.style.display = '';
        updateScanTime();

        document.getElementById('plateNumber').textContent = data.plate || '---';

        // Badges
        const badgesEl = document.getElementById('badges');
        badgesEl.innerHTML = '';
        if (data.insurance === false) {
            badgesEl.innerHTML += '<span class="badge badge-danger">NEASIGURAT</span>';
        } else {
            badgesEl.innerHTML += '<span class="badge badge-success">ASIGURAT</span>';
        }
        if (data.wanted) {
            badgesEl.innerHTML += '<span class="badge badge-danger">CĂUTAT</span>';
        }
        if (data.stolen) {
            badgesEl.innerHTML += '<span class="badge badge-warning">FURAT</span>';
        }
        if (data.license === 'SUSPENDAT' || data.license === 'EXPIRAT') {
            badgesEl.innerHTML += '<span class="badge badge-danger">PERMIS ' + data.license + '</span>';
        } else if (data.license === 'VALID') {
            badgesEl.innerHTML += '<span class="badge badge-success">PERMIS VALID</span>';
        }
        if (data.speed && parseInt(data.speed) > 100) {
            badgesEl.innerHTML += '<span class="badge badge-purple">VITEZĂ: ' + data.speed + ' MPH</span>';
        }
        if (data.tags && Array.isArray(data.tags)) {
            data.tags.forEach(t => {
                const cls = t.type === 'danger' ? 'badge-danger' : t.type === 'warning' ? 'badge-warning' : t.type === 'success' ? 'badge-success' : t.type === 'purple' ? 'badge-purple' : 'badge-info';
                badgesEl.innerHTML += '<span class="badge ' + cls + '">' + t.label + '</span>';
            });
        }

        // Vehicle info
        document.getElementById('vModel').textContent = data.model || '-';
        document.getElementById('vColor').textContent = data.color || '-';
        document.getElementById('vVin').textContent = data.vin || '-';
        document.getElementById('vYear').textContent = data.year || '-';

        // Owner info
        document.getElementById('oName').textContent = data.ownerName || '-';
        document.getElementById('oId').textContent = data.ownerId || '-';

        const licEl = document.getElementById('oLicense');
        licEl.textContent = data.license || '-';
        licEl.style.color = data.license === 'VALID' ? '#22c55e' : '#ef4444';

    }

    function clearTarget() {
        noTarget.style.display = '';
        scanningOverlay.classList.remove('active');
        vehicleData.style.display = 'none';
    }

    // ── DRAGGABLE HUD ──
    let isDragging = false;
    let dragOffsetX = 0, dragOffsetY = 0;

    const header = document.querySelector('.alpr-header');
    header.addEventListener('mousedown', (e) => {
        isDragging = true;
        const rect = container.getBoundingClientRect();
        dragOffsetX = e.clientX - rect.left;
        dragOffsetY = e.clientY - rect.top;
        e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let x = e.clientX - dragOffsetX;
        let y = e.clientY - dragOffsetY;
        // Clamp to viewport
        x = Math.max(0, Math.min(window.innerWidth - container.offsetWidth, x));
        y = Math.max(0, Math.min(window.innerHeight - container.offsetHeight, y));
        container.style.left = x + 'px';
        container.style.top = y + 'px';
        container.style.right = 'auto';
        container.style.bottom = 'auto';
    });

    document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        // Save position
        const rect = container.getBoundingClientRect();
        try {
            mp.trigger('alpr:saveHudPos', rect.left, rect.top);
        } catch(_) {}
    });

    // Load saved position on init
    function setHudPosition(x, y) {
        if (x != null && y != null) {
            container.style.left = x + 'px';
            container.style.top = y + 'px';
            container.style.right = 'auto';
            container.style.bottom = 'auto';
        }
    }
</script>
</body>
</html>
