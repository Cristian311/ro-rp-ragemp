<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    @font-face {
        font-family: "Seg-7";
        src: url("fonts/Segment7Standard.otf");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: transparent; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.677vw; }

    /* ═══════════════════════════════════════════════
       RADAR FRAME — octagonal border, textured
    ═══════════════════════════════════════════════ */
    #stalker-radar {
        position: fixed;
        bottom: 0.833vw;
        left: 50%;
        transform: translateX(-50%) scale(0.75);
        transform-origin: center bottom;
        width: 33vw;
        height: 11.979vw;
        display: none;
        opacity: 0;
        transition: opacity 0.4s;
        z-index: 2;
        /* Textured plastic frame */
        background:
            repeating-linear-gradient(87deg, rgba(255,255,255,0.012) 0, transparent 0.052vw, transparent 0.156vw),
            repeating-linear-gradient(0deg, rgba(255,255,255,0.01) 0, transparent 0.052vw, transparent 0.104vw),
            linear-gradient(170deg, #33352e 0%, #2a2c25 12%, #22241e 30%, #282a23 50%, #1f211b 70%, #262821 88%, #2e302a 100%);
        border-radius: 1.042vw;
        box-shadow:
            0 0.417vw 1.562vw rgba(0,0,0,0.7),
            inset 0 0.104vw 0.052vw rgba(255,255,255,0.08),
            inset 0 -0.104vw 0.052vw rgba(0,0,0,0.4),
            inset 0.104vw 0 0.052vw rgba(255,255,255,0.03),
            inset -0.104vw 0 0.052vw rgba(0,0,0,0.2);
        border: 0.13vw solid #0e0e0e;
    }
    /* Plastic grain texture overlay — heavy realistic noise */
    #stalker-radar::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 0.938vw;
        background:
            repeating-linear-gradient(0deg, rgba(200,200,180,0.018) 0, transparent 0.052vw, transparent 0.104vw),
            repeating-linear-gradient(90deg, rgba(200,200,180,0.015) 0, transparent 0.052vw, transparent 0.104vw),
            repeating-linear-gradient(45deg, rgba(0,0,0,0.015) 0, transparent 0.052vw, transparent 0.208vw),
            repeating-linear-gradient(135deg, rgba(255,255,255,0.008) 0, transparent 0.052vw, transparent 0.26vw),
            linear-gradient(180deg, rgba(120,115,100,0.18) 0%, rgba(60,58,50,0.06) 8%, transparent 20%, transparent 80%, rgba(0,0,0,0.12) 92%, rgba(0,0,0,0.2) 100%);
        pointer-events: none;
        z-index: 10;
    }
    /* Secondary highlight edge */
    #stalker-radar::after {
        content: '';
        position: absolute;
        inset: 0.156vw;
        border-radius: 0.885vw;
        border: 0.052vw solid rgba(255,255,255,0.03);
        pointer-events: none;
        z-index: 11;
    }
    #stalker-radar.visible { display: block; opacity: 1; }

    /* Inner display area — rounded to match frame */
    .frame-border {
        width: 32.0vw;
        height: 11.042vw;
        position: absolute;
        margin: auto;
        top: 0; right: 0; bottom: 0; left: 0;
        background-color: rgb(16, 18, 14);
        border-radius: 0.729vw;
    }

    /* ═══════════════════════════════════════════════
       RADAR CONTAINER — 3-column: side | main | side
    ═══════════════════════════════════════════════ */
    .radar-container {
        width: 31.5vw;
        height: 10.417vw;
        position: absolute;
        margin: auto;
        top: 0; right: 0; bottom: 0; left: 0;
    }



    /* ═══════════════════════════════════════════════
       MAIN RADAR — 8-column grid
    ═══════════════════════════════════════════════ */
    #radar {
        height: 100%;
        width: 100%;
        display: grid;
        grid-template-columns: 2.4vw 2.6vw 8vw 2.6vw 8vw 1fr;
        background:
            repeating-linear-gradient(90deg, rgba(200,195,180,0.012) 0, transparent 0.052vw, transparent 0.156vw),
            repeating-linear-gradient(0deg, rgba(200,195,180,0.008) 0, transparent 0.052vw, transparent 0.104vw),
            linear-gradient(180deg, #131510 0%, #181a13 30%, #1c1e16 50%, #181a13 70%, #131510 100%);
        box-shadow: inset 0 1.042vw 1.042vw -0.781vw rgba(0,0,0,0.4);
        position: relative;
        padding-top: 1.1vw;
        padding-bottom: 1.1vw;
    }

    /* Antenna labels */
    #radar .label {
        font-size: 0.781vw;
        text-align: center;
        width: 100%;
        position: absolute;
        color: rgb(255,255,255);
        font-weight: bold;
        letter-spacing: 0.052vw;
        z-index: 2;
    }
    #radar .label-top { top: 0; left: 0; padding-top: 0.15vw; }
    #radar .label-bottom { bottom: 0; left: 0; padding-bottom: 0.15vw; }

    /* ── PWR BUTTON ── */
    .pwr-button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-left: 1vw;
        padding-right: 1vw;
    }
    .pwr-button {
        width: 2.344vw;
        height: 2.344vw;
        background: linear-gradient(to bottom, rgba(230,230,230,0.8), rgb(40,168,40) 10%, rgb(0,134,0));
        box-shadow: 0 0 0.156vw 0 rgb(80,80,80);
        text-align: center;
        font-size: 0.729vw;
        color: rgb(34,34,34);
        line-height: 2.344vw;
        border-radius: 0.521vw;
        font-weight: bold;
    }

    /* ── MODES (SAME / OPP / XMIT) ── */
    .modes-container {
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
    }
    .modes-container > .modes {
        flex: 0 0 auto;
    }
    .modes {
        display: flex;
        flex-direction: column;
        padding: 0.521vw 0;
    }
    .modes p {
        margin: auto;
        font-size: 0.677vw;
        font-weight: bold;
        color: rgb(50,50,50);
        transition: color 0.15s, text-shadow 0.15s;
    }
    .modes p.active {
        color: rgb(242, 70, 24);
        text-shadow: 0 0 0.312vw rgba(235, 62, 15, 0.5);
    }
    .fast-modes-top {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
    }
    .fast-modes-bottom {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
    }

    /* ── SPEED DISPLAYS ── */
    .speeds-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
    }
    .display {
        display: grid;
        grid-template-columns: 1fr;
        height: 3.646vw;
        border: 0.104vw solid rgb(0,0,0);
        background-color: rgb(61, 18, 0);
    }
    .display p {
        grid-row-start: 1;
        grid-column-start: 1;
        font-family: 'Seg-7', monospace;
        font-size: 3.646vw;
        text-align: center;
        line-height: 115%;
        margin: 0 auto;
        letter-spacing: 0.521vw;
        margin-right: -0.469vw;
    }
    .display .ghost-speed {
        color: rgb(90, 35, 1);
    }
    .display .speed {
        color: rgb(252, 113, 1);
        text-shadow: 0 0 0.417vw rgba(252, 114, 1, 0.65);
    }

    /* Fast / Lock display (red) */
    .display.fast {
        height: 3.646vw;
        background-color: rgb(50, 0, 0);
    }
    .display.fast p {
        font-size: 3.646vw;
        line-height: 115%;
        margin-right: -0.469vw;
    }
    .display.fast .ghost-speed {
        color: rgb(70, 0, 0);
    }
    .display.fast .speed {
        color: rgb(243, 12, 10);
        text-shadow: 0 0 0.417vw rgba(243, 14, 10, 0.65);
    }
    .fast-top { margin-top: 0; }
    .fast-bottom { margin-bottom: 0; }

    /* Patrol display (green) */
    .display.patrol {
        background-color: rgb(0, 57, 35);
        height: 2.8vw;
    }
    .display.patrol p {
        font-size: 2.8vw;
        letter-spacing: 0.35vw;
        margin-right: -0.3vw;
    }
    .display.patrol .ghost-speed {
        color: rgb(0, 91, 68);
    }
    .display.patrol .speed {
        color: rgb(15, 244, 57);
        text-shadow: 0 0 0.417vw rgba(15, 244, 57, 0.65);
    }

    /* ── PATROL + LOGO ── */
    .patrol-and-logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4vw;
        height: 100%;
        padding: 1.2vw 0.3vw;
        padding-left: 0.5vw;
        padding-right: 1vw;
    }
    .patrol-and-logo-container .logo {
        font-size: 0.85vw;
        text-align: center;
        line-height: 120%;
        font-style: italic;
        color: rgb(255,255,255);
        font-weight: bold;
        white-space: nowrap;
    }
    .patrol-and-logo-container .logo .name {
        font-size: 1.15vw;
    }
    .patrol-and-logo-container .speeds-container {
        width: 100%;
    }
    .patrol-and-logo-container .speed-label {
        color: rgb(255,255,255);
        font-size: 0.6vw;
        letter-spacing: 0.03vw;
    }

    /* ═══════════════════════════════════════════════
       HELP PANEL
    ═══════════════════════════════════════════════ */
    #help-panel {
        position: fixed;
        top: 1.042vw;
        right: 1.042vw;
        width: 12.5vw;
        background: rgba(12, 12, 16, 0.85);
        border: 0.052vw solid rgba(255,255,255,0.06);
        border-radius: 0.521vw;
        backdrop-filter: blur(0.729vw);
        -webkit-backdrop-filter: blur(0.729vw);
        padding: 0.625vw 0.729vw 0.521vw;
        display: none;
        opacity: 0;
        transition: opacity 0.4s ease, transform 0.4s ease;
        transform: translateY(-0.417vw);
        box-shadow: 0 0.417vw 1.667vw rgba(0,0,0,0.5);
        z-index: 100;
        pointer-events: none;
    }
    #help-panel.visible { display: block; opacity: 1; transform: translateY(0); }
    #help-panel.fading { opacity: 0; transform: translateY(-0.417vw); }
    .help-title {
        font-size: 0.521vw; font-weight: 700;
        color: rgba(255,255,255,0.4);
        letter-spacing: 0.104vw; text-transform: uppercase;
        margin-bottom: 0.521vw; text-align: center;
    }
    .help-row { display: flex; align-items: center; gap: 0.521vw; margin-bottom: 0.365vw; }
    .help-row:last-child { margin-bottom: 0; }
    .keycap {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 1.979vw; height: 1.354vw; padding: 0 0.312vw;
        background: linear-gradient(180deg, #3a3a42 0%, #2a2a30 100%);
        border: 0.052vw solid rgba(255,255,255,0.1);
        border-bottom: 0.13vw solid rgba(0,0,0,0.4);
        border-radius: 0.26vw;
        font-size: 0.521vw; font-weight: 700; color: #e0e0e0;
        letter-spacing: 0.026vw;
        text-shadow: 0 0.052vw 0.104vw rgba(0,0,0,0.5);
        box-shadow: 0 0.052vw 0.156vw rgba(0,0,0,0.3), inset 0 0.052vw 0 rgba(255,255,255,0.06);
        flex-shrink: 0;
    }
    .help-desc { font-size: 0.573vw; color: rgba(255,255,255,0.65); font-weight: 500; line-height: 1.3; }
    .help-separator { height: 0.052vw; background: rgba(255,255,255,0.06); margin: 0.417vw 0; }
</style>
</head>
<body>

<!-- ═══ HELP PANEL ═══ -->
<div id="help-panel">
    <div class="help-title">Stalker Controls</div>
    <div class="help-row"><span class="keycap">Num 0</span><span class="help-desc">Radar ON / OFF</span></div>
    <div class="help-row"><span class="keycap">Num 1</span><span class="help-desc">Lock / Unlock speed</span></div>
    <div class="help-row"><span class="keycap">Num 2</span><span class="help-desc">Fast mode (rapid + noisy)</span></div>
    <div class="help-separator"></div>
    <div class="help-row"><span class="keycap">Num 4</span><span class="help-desc">Front antenna XMIT</span></div>
    <div class="help-row"><span class="keycap">Num 5</span><span class="help-desc">Rear antenna XMIT</span></div>
</div>

<!-- ═══ STALKER RADAR FRAME ═══ -->
<div id="stalker-radar">
    <div class="frame-border"></div>

    <div class="radar-container">

        <div id="radar">
            <div class="label label-top">FRONT ANTENNA</div>

            <!-- Col 1: PWR Button -->
            <div class="pwr-button-container">
                <div class="pwr-button" id="pwrBtn">PWR</div>
            </div>

            <!-- Col 2: Modes (Front top / Rear bottom) -->
            <div class="modes-container">
                <div class="modes">
                    <p id="frontSame">SAME</p>
                    <p id="frontOpp">OPP</p>
                    <p id="frontXmit">XMIT</p>
                </div>
                <div class="modes">
                    <p id="rearSame">SAME</p>
                    <p id="rearOpp">OPP</p>
                    <p id="rearXmit">XMIT</p>
                </div>
            </div>

            <!-- Col 3: Target Speeds (Front top / Rear bottom) -->
            <div class="speeds-container">
                <div class="display" id="frontDisplay">
                    <p class="ghost-speed">888</p>
                    <p class="speed" id="frontSpeed"></p>
                </div>
                <div class="display" id="rearDisplay">
                    <p class="ghost-speed">888</p>
                    <p class="speed" id="rearSpeed"></p>
                </div>
            </div>

            <!-- Col 4: Fast/Lock Modes -->
            <div class="modes-container">
                <div class="modes fast-modes-top">
                    <p id="frontFastLabel">FAST</p>
                    <p id="frontLockLabel">LOCK</p>
                </div>
                <div class="modes fast-modes-bottom">
                    <p id="rearFastLabel">FAST</p>
                    <p id="rearLockLabel">LOCK</p>
                </div>
            </div>

            <!-- Col 6: Lock/Fast Speeds -->
            <div class="speeds-container">
                <div class="display fast fast-top" id="frontLockDisplay">
                    <p class="ghost-speed">888</p>
                    <p class="speed" id="frontLockSpeed"></p>
                </div>
                <div class="display fast fast-bottom" id="rearLockDisplay">
                    <p class="ghost-speed">888</p>
                    <p class="speed" id="rearLockSpeed"></p>
                </div>
            </div>

            <!-- Col 6: Logo + Patrol Speed -->
            <div class="patrol-and-logo-container">
                <div class="logo"><span class="name">Stalker</span> DSR 2X</div>
                <div class="speeds-container">
                    <div class="display fast patrol">
                        <p class="ghost-speed">888</p>
                        <p class="speed" id="patrolSpeed"></p>
                    </div>
                </div>
                <div class="speed-label">PATROL SPEED</div>
            </div>

            <div class="label label-bottom">REAR ANTENNA</div>
        </div>
    </div>
</div>

<script>
    const radar = document.getElementById('stalker-radar');
    const el = id => document.getElementById(id);

    // Speed display elements
    const frontSpeedEl = el('frontSpeed'), frontDisplayEl = el('frontDisplay');
    const frontLockSpeedEl = el('frontLockSpeed'), frontLockDisplayEl = el('frontLockDisplay');
    const frontSameEl = el('frontSame'), frontOppEl = el('frontOpp'), frontXmitEl = el('frontXmit');
    const frontLockLbl = el('frontLockLabel'), frontFastLbl = el('frontFastLabel');

    const rearSpeedEl = el('rearSpeed'), rearDisplayEl = el('rearDisplay');
    const rearLockSpeedEl = el('rearLockSpeed'), rearLockDisplayEl = el('rearLockDisplay');
    const rearSameEl = el('rearSame'), rearOppEl = el('rearOpp'), rearXmitEl = el('rearXmit');
    const rearLockLbl = el('rearLockLabel'), rearFastLbl = el('rearFastLabel');

    const patrolSpeedEl = el('patrolSpeed');

    function show() { radar.style.display = 'block'; setTimeout(() => radar.classList.add('visible'), 10); }
    function hide() { radar.classList.remove('visible'); setTimeout(() => radar.style.display = 'none', 400); }

    function pad3(v) {
        v = Math.round(v);
        if (v < 0) v = 0;
        if (v > 999) v = 999;
        return String(v).padStart(3, '0');
    }

    function updatePatrolSpeed(s) {
        patrolSpeedEl.textContent = pad3(s);
    }

    function updateFrontAntenna(d) {
        frontXmitEl.classList.toggle('active', !!d.xmit);
        if (d.speed != null) {
            frontSpeedEl.textContent = pad3(d.speed);
            frontSameEl.classList.toggle('active', d.direction === 'same');
            frontOppEl.classList.toggle('active', d.direction === 'opp');
        } else {
            frontSpeedEl.textContent = '';
            frontSameEl.classList.remove('active');
            frontOppEl.classList.remove('active');
        }
    }

    function updateRearAntenna(d) {
        rearXmitEl.classList.toggle('active', !!d.xmit);
        if (d.speed != null) {
            rearSpeedEl.textContent = pad3(d.speed);
            rearSameEl.classList.toggle('active', d.direction === 'same');
            rearOppEl.classList.toggle('active', d.direction === 'opp');
        } else {
            rearSpeedEl.textContent = '';
            rearSameEl.classList.remove('active');
            rearOppEl.classList.remove('active');
        }
    }

    function lockFront(s) {
        if (s != null) {
            frontLockSpeedEl.textContent = pad3(s);
            frontLockLbl.classList.add('active');
        } else {
            frontLockSpeedEl.textContent = '';
            frontLockLbl.classList.remove('active');
        }
    }

    function lockRear(s) {
        if (s != null) {
            rearLockSpeedEl.textContent = pad3(s);
            rearLockLbl.classList.add('active');
        } else {
            rearLockSpeedEl.textContent = '';
            rearLockLbl.classList.remove('active');
        }
    }

    function setFastIndicator(on) {
        frontFastLbl.classList.toggle('active', on);
        rearFastLbl.classList.toggle('active', on);
    }

    function resetRadar() {
        updatePatrolSpeed(0);
        updateFrontAntenna({ speed: null, direction: null, xmit: false });
        updateRearAntenna({ speed: null, direction: null, xmit: false });
        lockFront(null);
        lockRear(null);
        setFastIndicator(false);
    }

    // ── HELP PANEL ──
    const helpPanel = document.getElementById('help-panel');
    let helpTimer = null;
    function showHelp() {
        if (helpTimer) clearTimeout(helpTimer);
        helpPanel.style.display = 'block';
        helpPanel.classList.remove('fading');
        requestAnimationFrame(() => helpPanel.classList.add('visible'));
        helpTimer = setTimeout(() => {
            helpPanel.classList.add('fading');
            helpPanel.classList.remove('visible');
            setTimeout(() => { helpPanel.style.display = 'none'; helpPanel.classList.remove('fading'); }, 450);
        }, 6000);
    }
    function hideHelp() {
        if (helpTimer) { clearTimeout(helpTimer); helpTimer = null; }
        helpPanel.classList.add('fading');
        helpPanel.classList.remove('visible');
        setTimeout(() => { helpPanel.style.display = 'none'; helpPanel.classList.remove('fading'); }, 450);
    }
</script>
</body>
</html>
