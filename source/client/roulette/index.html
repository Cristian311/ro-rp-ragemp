<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette HUD</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    pointer-events: none;
}
/* Everything is non-interactive — HUD only */

/* ── TOPBAR ── */
#topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 36px;
    background: linear-gradient(180deg, rgba(10,10,10,0.85), rgba(20,20,20,0.7));
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid rgba(255,215,0,0.3);
    z-index: 100;
}
.logo { color: #ffd700; font-weight: 700; font-size: 13px; letter-spacing: 1px; }
.sep { width: 1px; height: 18px; background: rgba(255,255,255,0.15); }
.info { color: #ccc; font-size: 12px; }
#phase-label { color: #ffd700; font-weight: 600; }

/* ── CHIPS INFO ── */
#chips-info {
    position: fixed; top: 42px; left: 16px;
    display: flex; gap: 8px; z-index: 90;
}
.info-box {
    background: rgba(10,10,10,0.75);
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 6px; padding: 6px 12px; text-align: center;
}
.info-label { color: #999; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
.info-value { color: #ffd700; font-size: 16px; font-weight: 700; }

/* ── TIMER ── */
#timer-wrap {
    position: fixed; top: 42px; left: 50%;
    transform: translateX(-50%);
    display: none; flex-direction: column; align-items: center; gap: 4px;
    z-index: 90;
}
#timer-wrap.visible { display: flex; }
#timer-ring { position: relative; width: 50px; height: 50px; }
#timer-ring svg { transform: rotate(-90deg); }
#track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 3; }
#fill { fill: none; stroke: #ffd700; stroke-width: 3;
    stroke-dasharray: 138.23; stroke-dashoffset: 0;
    stroke-linecap: round; transition: stroke-dashoffset 0.5s linear, stroke 0.3s; }
#timer-num {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 16px; font-weight: 700;
}
#timer-label { color: #ffd700; font-size: 11px; text-align: center; }

/* ── RESULT BANNER ── */
#result-banner {
    display: none !important;
}
#result-banner.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#result-number {
    font-size: 48px; font-weight: 800; margin-bottom: 4px;
}
#result-number.red { color: #e74c3c; }
#result-number.black { color: #ecf0f1; }
#result-number.green { color: #2ecc71; }
#result-text { color: #ccc; font-size: 14px; }
#result-win { font-size: 22px; font-weight: 700; margin-top: 8px; }
.win-glow { animation: pulseGlow 1s ease-in-out infinite alternate; }
@keyframes pulseGlow { from { text-shadow: 0 0 10px rgba(39,174,96,0.5); } to { text-shadow: 0 0 30px rgba(39,174,96,1); } }
#result-glow {
    position: absolute; inset: -4px; border-radius: 18px;
    opacity: 0.3; z-index: -1;
}
.glow-red { background: radial-gradient(circle, rgba(231,76,60,0.4), transparent 70%); }
.glow-black { background: radial-gradient(circle, rgba(200,200,200,0.2), transparent 70%); }
.glow-green { background: radial-gradient(circle, rgba(46,204,113,0.4), transparent 70%); }

/* ── PLAYER LIST ── */
#player-list {
    position: fixed; top: 42px; right: 16px;
    width: 180px; z-index: 90;
    background: rgba(10,10,10,0.7);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 8px; overflow: hidden;
}
.pl-header {
    padding: 6px 10px; color: #ffd700; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 1px solid rgba(255,215,0,0.15);
}
.pl-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.pl-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,215,0,0.15); color: #ffd700;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
}
.pl-name { color: #fff; font-size: 12px; }
.pl-chips { color: #aaa; font-size: 10px; }
.pl-win { color: #2ecc71; font-size: 11px; font-weight: 600; margin-left: auto; }

/* ── HISTORY ── */
#history {
    position: fixed; bottom: 16px; left: 16px;
    z-index: 90;
}
.h-title { color: #999; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
#history-items { display: flex; flex-wrap: wrap; gap: 4px; max-width: 300px; }
.history-num {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
}
.history-num.red { background: #c0392b; }
.history-num.black { background: #2c3e50; }
.history-num.green { background: #27ae60; }
.history-num.new-entry { animation: histPop 0.4s ease-out; }
@keyframes histPop { from { transform: scale(0); } to { transform: scale(1); } }

/* ── CONFETTI ── */
#confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
.confetti {
    position: absolute; animation: confettiFall 3s ease-out forwards;
}
@keyframes confettiFall {
    0% { transform: translateY(0) translateX(0) rotate(0); opacity: 1; }
    100% { transform: translateY(100vh) translateX(var(--confetti-x)) rotate(var(--confetti-r)); opacity: 0; }
}
.win-particle {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: #ffd700; animation: particleBurst 0.8s ease-out forwards;
}
@keyframes particleBurst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
}

/* ── TOAST ── */
#toast {
    position: fixed; bottom: 160px; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,10,0.85); color: #ffd700;
    padding: 8px 20px; border-radius: 6px; font-size: 13px; font-weight: 600;
    border: 1px solid rgba(255,215,0,0.3);
    opacity: 0; transition: opacity 0.3s; z-index: 150;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">ROULETTE</div>
</div>

<div id="chips-info">
  <div class="info-box">
    <div class="info-label">CHIPS</div>
    <div class="info-value" id="chips-value">$0</div>
  </div>
  <div class="info-box">
    <div class="info-label">PARIU TOTAL</div>
    <div class="info-value" id="bet-value">$0</div>
  </div>
</div>

<div id="timer-wrap">
  <div id="timer-ring">
    <svg width="50" height="50" viewBox="0 0 50 50">
      <circle id="track" cx="25" cy="25" r="22"/>
      <circle id="fill" cx="25" cy="25" r="22"/>
    </svg>
    <div id="timer-num">30</div>
  </div>
  <div id="timer-label">Plasati pariurile</div>
</div>

<div id="confetti-container"></div>

<div id="result-banner">
  <div id="result-glow"></div>
  <div id="result-number">0</div>
  <div id="result-text"></div>
  <div id="result-win"></div>
</div>

<div id="player-list">
  <div class="pl-header"><span>Jucatori</span></div>
  <div id="pl-rows"></div>
</div>

<div id="history">
  <div class="h-title">ISTORIC</div>
  <div id="history-items"></div>
</div>



<script>
const RED_NUMBERS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const CIRCUMFERENCE = 2 * Math.PI * 22;
let myBets = [], myChips = 0, myTotalBet = 0, timerTotal = 30;
let toastTimeout = null, resultBannerTimeout = null;

function getNumberColor(num) {
    if (num === 0 || num === '00') return 'green';
    if (RED_NUMBERS.includes(typeof num === 'string' ? parseInt(num) : num)) return 'red';
    return 'black';
}

// Confetti
function spawnConfetti(count, color) {
    const c = document.getElementById('confetti-container'); c.innerHTML = '';
    const cols = color==='green'?['#27ae60','#2ecc71','#f0d080','#fff']:
                 color==='red'?['#e74c3c','#c0392b','#f0d080','#fff']:['#ecf0f1','#bdc3c7','#f0d080','#fff'];
    for (let i = 0; i < count; i++) {
        const el = document.createElement('div'); el.className = 'confetti';
        const sz = 4+Math.random()*8; el.style.width = sz+'px';
        el.style.height = (Math.random()>0.5?sz:sz*2.5)+'px';
        el.style.borderRadius = Math.random()>0.5?'50%':'2px';
        el.style.background = cols[Math.floor(Math.random()*cols.length)];
        el.style.left = (10+Math.random()*80)+'%'; el.style.top = '-10px';
        el.style.setProperty('--confetti-x',(Math.random()-0.5)*400+'px');
        el.style.setProperty('--confetti-r',Math.random()*720-360+'deg');
        el.style.animationDuration = (2+Math.random()*2.5)+'s';
        el.style.animationDelay = (Math.random()*0.6)+'s';
        c.appendChild(el);
    }
    setTimeout(()=>{c.innerHTML='';},6000);
}
function spawnWinParticles() {
    const c = document.getElementById('confetti-container');
    for (let i = 0; i < 25; i++) {
        const el = document.createElement('div'); el.className = 'win-particle';
        const a = Math.random()*360, d = 60+Math.random()*250;
        el.style.setProperty('--px',Math.cos(a*Math.PI/180)*d+'px');
        el.style.setProperty('--py',Math.sin(a*Math.PI/180)*d+'px');
        el.style.left='50%'; el.style.top='50%';
        el.style.animationDelay = Math.random()*0.3+'s';
        c.appendChild(el);
    }
}

// State update
function updateGameState(stateJson) {
    const s = JSON.parse(stateJson);
    // phase label removed
    renderPlayerList(s.players||[]);
    renderHistory(s.history||[]);
}

function updateMyBets(betsJson, chips, totalBet) {
    myBets = JSON.parse(betsJson); myChips = chips; myTotalBet = totalBet;
    document.getElementById('chips-value').textContent = `$${chips.toLocaleString('en-US')}`;
    document.getElementById('bet-value').textContent = `$${totalBet.toLocaleString('en-US')}`;
}

function onBettingStart(betTime) {
    timerTotal = betTime;
    document.getElementById('timer-wrap').classList.add('visible');
    document.getElementById('timer-label').textContent = 'Plasati pariurile';
    document.getElementById('timer-num').textContent = betTime;
    document.getElementById('result-banner').classList.remove('visible');
    // toast removed
}

function updateBetTimer(timeLeft) {
    const wrap = document.getElementById('timer-wrap');
    const fillEl = document.getElementById('fill');
    const numEl = document.getElementById('timer-num');
    if (timeLeft <= 0) { wrap.classList.remove('visible'); return; }
    wrap.classList.add('visible');
    numEl.textContent = timeLeft;
    fillEl.style.strokeDasharray = CIRCUMFERENCE;
    const ratio = timeLeft / timerTotal;
    fillEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
    if (ratio < 0.2) fillEl.style.stroke = '#e74c3c';
    else if (ratio < 0.5) fillEl.style.stroke = '#f39c12';
    else fillEl.style.stroke = '#ffd700';
    if (timeLeft <= 5) document.getElementById('timer-label').textContent = 'Ultimele secunde!';
}

function onSpinStart(winningNumber, winningColor, spinTime) {
    document.getElementById('timer-wrap').classList.remove('visible');
    document.getElementById('result-banner').classList.remove('visible');
    // toast removed
}

function onShowResult(number, color, stateJson) {
    const state = JSON.parse(stateJson);
    const banner = document.getElementById('result-banner');
    const numEl = document.getElementById('result-number');
    numEl.className = color; numEl.textContent = number;
    const cn = color==='red'?'Rosu':color==='black'?'Negru':'Verde';
    document.getElementById('result-text').textContent = `${number} — ${cn}`;

    let myWin = 0;
    myBets.forEach(bet => {
        if (bet.numbers && bet.numbers.includes(number))
            myWin += bet.amount + (bet.amount * bet.payout);
    });
    const winEl = document.getElementById('result-win');
    if (myWin > 0) {
        winEl.textContent = `+$${myWin.toLocaleString('en-US')}`;
        winEl.style.color = '#27ae60'; winEl.className = 'win-glow';
        spawnConfetti(80, color); spawnWinParticles();
    } else if (myTotalBet > 0) {
        winEl.textContent = `-$${myTotalBet.toLocaleString('en-US')}`;
        winEl.style.color = '#e74c3c'; winEl.className = '';
    } else { winEl.textContent = ''; winEl.className = ''; }

    document.getElementById('result-glow').className = `glow-${color}`;
    banner.classList.add('visible');
    clearTimeout(resultBannerTimeout);
    resultBannerTimeout = setTimeout(()=>banner.classList.remove('visible'), 5000);
    renderPlayerList(state.players||[]);
    renderHistory(state.history||[]);
    myBets = []; myTotalBet = 0;
}

function renderPlayerList(players) {
    const c = document.getElementById('pl-rows'); c.innerHTML = '';
    players.forEach(p => {
        const r = document.createElement('div'); r.className = 'pl-row';
        r.innerHTML = `<div class="pl-avatar">${esc(p.name.charAt(0).toUpperCase())}</div>
            <div><div class="pl-name">${esc(p.name)}</div>
            <div class="pl-chips">$${p.chips.toLocaleString('en-US')}${p.totalBet>0?' <span style="color:#ffd700">bet $'+p.totalBet+'</span>':''}</div></div>
            ${p.lastWin>0?'<div class="pl-win">+$'+p.lastWin.toLocaleString('en-US')+'</div>':''}`;
        c.appendChild(r);
    });
}

function renderHistory(history) {
    const c = document.getElementById('history-items'); c.innerHTML = '';
    history.forEach((h, i) => {
        const el = document.createElement('div');
        el.className = `history-num ${h.color}`; el.textContent = h.number;
        if (i === 0) el.classList.add('new-entry');
        c.appendChild(el);
    });
}

function showToast(msg, dur) {
    clearTimeout(toastTimeout);
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    toastTimeout = setTimeout(()=>el.classList.remove('show'), dur||2500);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
