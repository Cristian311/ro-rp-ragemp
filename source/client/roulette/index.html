<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>Roulette HUD – RageMP</title>
</head>
<body>

<div id="topbar">
  <div class="logo">🎰 ROULETTE HUD</div>
  <div class="sep"></div>
  <div class="info" id="phase-label">WAITING</div>
  <div class="info">RageMP v1.1</div>
  <button id="btn-leave" onclick="leaveTable()">✕ LEAVE</button>
</div>

<!-- Chips info -->

  <div class="info-box">
    <div class="info-label">CHIPS</div>
    <div class="info-value" id="chips-value">$0</div>
  </div>
  <div class="info-box">
    <div class="info-label">PARIU TOTAL</div>
    <div class="info-value" id="bet-value">$0</div>
  </div>

<!-- Timer -->

  <div id="timer-ring">
    <svg width="50" height="50" viewBox="0 0 50 50">
      <circle id="track" cx="25" cy="25" r="22"/>
      <circle id="fill" cx="25" cy="25" r="22"/>
    </svg>
    <div id="timer-num">30</div>
  </div>

</div>

<!-- Bet chip selector -->
<div id="bet-selector">
  <div class="chip-btn chip-10 selected" data-amount="10" onclick="selectChip(10, this)">10</div>
  <div class="chip-btn chip-25" data-amount="25" onclick="selectChip(25, this)">25</div>
  <div class="chip-btn chip-50" data-amount="50" onclick="selectChip(50, this)">50</div>
  <div class="chip-btn chip-100" data-amount="100" onclick="selectChip(100, this)">100</div>
  <div class="chip-btn chip-500" data-amount="500" onclick="selectChip(500, this)">500</div>
  <div class="chip-btn chip-1000" data-amount="1000" onclick="selectChip(1000, this)">1K</div>
</div>

<!-- Action buttons -->
<div id="actions">
  <button class="btn-action" id="btn-clear" onclick="clearAllBets()">🗑 ȘTERGE PARIURI</button>
</div>

<!-- Roulette board (betting table) -->
<div id="roulette-board">
  <!-- Built by JS -->
</div>

<!-- ═══ ROULETTE WHEEL ═══ -->
<div id="wheel-container">
  <div id="wheel-glow"></div>
  <canvas id="wheel-canvas" width="420" height="420"></canvas>

    <div id="wheel-logo">🎰</div>
  </div>

</div>

<!-- Confetti container for wins -->

<!-- Result banner -->

  <div id="result-glow"></div>
  <div id="result-number">0</div>
  <div id="result-text"></div>
  <div id="result-win"></div>
</div>

<!-- Player list -->
<div id="player-list">
  <div class="pl-header">
    <span>Jucători</span>
  </div>

</div>

<!-- History -->
<div id="history">
  <div class="h-title">ISTORIC</div>
  <div id="history-items"></div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const RED_NUMBERS  = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const BLACK_NUMBERS= [2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35];
const CIRCUMFERENCE = 2 * Math.PI * 22;

// European roulette wheel order
const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const SLOT_COUNT = WHEEL_ORDER.length; // 37
const SLOT_ANGLE = 360 / SLOT_COUNT;

let selectedChipAmount = 10;
let myBets = [];
let myChips = 0;
let myTotalBet = 0;
let timerTotal = 30;
let toastTimeout = null;
let resultBannerTimeout = null;

// Wheel animation state
let wheelAnimFrame = null;
let wheelCurrentAngle = 0;

// ══════════════════════════════════════════
// ROULETTE WHEEL — Canvas Drawing
// ══════════════════════════════════════════
const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');
const CX = 210, CY = 210, RADIUS = 190;

function getNumberColor(num) {
    if (num === 0) return 'green';
    if (RED_NUMBERS.includes(num)) return 'red';
    return 'black';
}

const COLOR_MAP = {
    red:   '#b71c1c',
    black: '#1a1a2e',
    green: '#1b5e20',
};
const COLOR_MAP_LIGHT = {
    red:   '#e53935',
    black: '#3d3d5c',
    green: '#2e7d32',
};

function drawWheel(rotation) {
    ctx.clearRect(0, 0, 420, 420);
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(rotation * Math.PI / 180);

    const slotArc = (2 * Math.PI) / SLOT_COUNT;

    // Outer shadow ring
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS + 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Outer chrome ring
    const chromeGrad = ctx.createRadialGradient(0, 0, RADIUS - 2, 0, 0, RADIUS + 5);
    chromeGrad.addColorStop(0, 'rgba(201,168,76,0.5)');
    chromeGrad.addColorStop(0.5, 'rgba(201,168,76,0.2)');
    chromeGrad.addColorStop(1, 'rgba(201,168,76,0.05)');
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS + 4, 0, Math.PI * 2);
    ctx.fillStyle = chromeGrad;
    ctx.fill();

    // Draw each slot
    for (let i = 0; i < SLOT_COUNT; i++) {
        const startAngle = i * slotArc - Math.PI / 2 - slotArc / 2;
        const endAngle = startAngle + slotArc;
        const num = WHEEL_ORDER[i];
        const color = getNumberColor(num);

        // Slot fill
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, RADIUS, startAngle, endAngle);
        ctx.closePath();

        // 3D gradient per slot
        const midAngle = startAngle + slotArc / 2;
        const grad = ctx.createRadialGradient(0, 0, RADIUS * 0.55, 0, 0, RADIUS);
        grad.addColorStop(0, COLOR_MAP_LIGHT[color]);
        grad.addColorStop(0.7, COLOR_MAP[color]);
        grad.addColorStop(1, color === 'black' ? '#0d0d1a' : COLOR_MAP[color]);
        ctx.fillStyle = grad;
        ctx.fill();

        // Slot divider
        ctx.beginPath();
        ctx.moveTo(Math.cos(startAngle) * RADIUS * 0.6, Math.sin(startAngle) * RADIUS * 0.6);
        ctx.lineTo(Math.cos(startAngle) * RADIUS, Math.sin(startAngle) * RADIUS);
        ctx.strokeStyle = 'rgba(201,168,76,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Number text
        ctx.save();
        ctx.rotate(midAngle);
        ctx.translate(RADIUS * 0.8, 0);
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px "Bebas Neue", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(String(num), 0, 0);
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    // Inner decorative ring
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS * 0.58, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Middle ring fill (dark)
    const midGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, RADIUS * 0.58);
    midGrad.addColorStop(0, '#1a252f');
    midGrad.addColorStop(0.7, '#0d1117');
    midGrad.addColorStop(1, '#080c14');
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = midGrad;
    ctx.fill();

    // Spokes from center to inner ring
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * 48, Math.sin(angle) * 48);
        ctx.lineTo(Math.cos(angle) * RADIUS * 0.53, Math.sin(angle) * RADIUS * 0.53);
        ctx.strokeStyle = 'rgba(201,168,76,0.15)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // Hub (center circle)
    const hubGrad = ctx.createRadialGradient(-10, -10, 5, 0, 0, 50);
    hubGrad.addColorStop(0, '#3a4a5e');
    hubGrad.addColorStop(0.4, '#1a252f');
    hubGrad.addColorStop(1, '#0a0f16');
    ctx.beginPath();
    ctx.arc(0, 0, 45, 0, Math.PI * 2);
    ctx.fillStyle = hubGrad;
    ctx.fill();

    // Hub border - gold ring
    ctx.beginPath();
    ctx.arc(0, 0, 45, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,0.6)';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Hub inner shine
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Outer ring stroke
    ctx.beginPath();
    ctx.arc(0, 0, RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
}

// Initial draw
drawWheel(0);

// ══════════════════════════════════════════
// WHEEL SPIN ANIMATION
// ══════════════════════════════════════════
function getTargetAngle(winningNumber) {
    const idx = WHEEL_ORDER.indexOf(winningNumber);
    const slotCenterAngle = idx * SLOT_ANGLE;
    const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 full rotations
    return extraSpins * 360 + (360 - slotCenterAngle);
}

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function animateWheel(winningNumber, duration, callback) {
    const startAngle = wheelCurrentAngle % 360;
    const targetAngle = startAngle + getTargetAngle(winningNumber);
    const startTime = performance.now();
    const durationMs = duration * 1000;

    const ball = document.getElementById('ball');
    ball.style.display = 'block';
    ball.style.opacity = '1';

    // Ball params
    let ballOrbitalAngle = Math.random() * 360;
    const ballBaseSpeed = -14; // opposite direction to wheel
    const BALL_OUTER_R = 200;
    const BALL_INNER_R = 153;

    // Pre-calculate winning slot ball position
    const winIdx = WHEEL_ORDER.indexOf(winningNumber);
    const winSlotAngleDeg = -90 + winIdx * SLOT_ANGLE + SLOT_ANGLE / 2;

    function frame(now) {
        const elapsed = now - startTime;
        let progress = Math.min(elapsed / durationMs, 1);
        const easedProgress = easeOutQuart(progress);

        // === Wheel rotation ===
        const currentAngle = startAngle + (targetAngle - startAngle) * easedProgress;
        wheelCurrentAngle = currentAngle;
        drawWheel(currentAngle);

        // === Ball animation ===
        if (progress < 0.65) {
            // Phase 1: Ball orbits fast counterclockwise on the outer track
            const speed = ballBaseSpeed * (1 - (progress / 0.65) * 0.6);
            ballOrbitalAngle += speed;
            const r = BALL_OUTER_R;
            const bx = CX + Math.cos(ballOrbitalAngle * Math.PI / 180) * r;
            const by = CY + Math.sin(ballOrbitalAngle * Math.PI / 180) * r;
            ball.style.left = bx + 'px';
            ball.style.top = by + 'px';
        } else if (progress < 0.80) {
            // Phase 2: Ball decelerates & drops inward (bouncing between tracks)
            const dropP = (progress - 0.65) / 0.15;
            const dropEase = easeInOutCubic(dropP);

            // Still moving but much slower
            const speed = ballBaseSpeed * 0.4 * (1 - dropP);
            ballOrbitalAngle += speed;

            // Drop from outer to inner with bounce
            const bounce = Math.sin(dropP * Math.PI * 4) * 15 * (1 - dropP);
            const r = BALL_OUTER_R - (BALL_OUTER_R - BALL_INNER_R - 10) * dropEase + bounce;

            const bx = CX + Math.cos(ballOrbitalAngle * Math.PI / 180) * r;
            const by = CY + Math.sin(ballOrbitalAngle * Math.PI / 180) * r;
            ball.style.left = bx + 'px';
            ball.style.top = by + 'px';
        } else {
            // Phase 3: Ball settles into winning pocket (moves with wheel)
            const settleP = (progress - 0.80) / 0.20;
            const settleEase = easeOutQuart(settleP);

            // Target: ball locked to winning slot, rotating with wheel
            const finalAngle = (winSlotAngleDeg + currentAngle) * Math.PI / 180;
            const finalR = BALL_INNER_R;
            const targetBx = CX + Math.cos(finalAngle) * finalR;
            const targetBy = CY + Math.sin(finalAngle) * finalR;

            // Current ball position
            const currR = BALL_INNER_R + 10 * (1 - settleEase);
            const currBx = CX + Math.cos(ballOrbitalAngle * Math.PI / 180) * currR;
            const currBy = CY + Math.sin(ballOrbitalAngle * Math.PI / 180) * currR;

            // Interpolate + tiny bounce at the very end
            const bx = currBx + (targetBx - currBx) * settleEase;
            const by = currBy + (targetBy - currBy) * settleEase;

            const microBounce = settleP > 0.6
                ? Math.sin((settleP - 0.6) / 0.4 * Math.PI * 3) * 3 * (1 - settleP)
                : 0;

            ball.style.left = (bx + microBounce) + 'px';
            ball.style.top = (by + microBounce) + 'px';
        }

        // === Glow intensifies near end ===
        const glow = document.getElementById('wheel-glow');
        if (progress > 0.7) {
            const intensity = (progress - 0.7) / 0.3;
            glow.style.opacity = String(0.2 + intensity * 0.6);
        }

        if (progress < 1) {
            wheelAnimFrame = requestAnimationFrame(frame);
        } else {
            // Done — final lock
            const finalAngle = (winSlotAngleDeg + currentAngle) * Math.PI / 180;
            ball.style.left = (CX + Math.cos(finalAngle) * BALL_INNER_R) + 'px';
            ball.style.top = (CY + Math.sin(finalAngle) * BALL_INNER_R) + 'px';
            ball.classList.add('settled');

            if (callback) callback();
        }
    }

    wheelAnimFrame = requestAnimationFrame(frame);
}

// ══════════════════════════════════════════
// CONFETTI / PARTICLES
// ══════════════════════════════════════════
function spawnConfetti(count, color) {
    const container = document.getElementById('confetti-container');
    container.innerHTML = '';
    const colors = color === 'green'
        ? ['#27ae60','#2ecc71','#f0d080','#fff','#1abc9c']
        : color === 'red'
        ? ['#e74c3c','#c0392b','#f0d080','#fff','#ff6b6b']
        : ['#ecf0f1','#bdc3c7','#f0d080','#fff','#95a5a6'];

    for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        const size = 4 + Math.random() * 8;
        const isCircle = Math.random() > 0.5;
        el.style.width = size + 'px';
        el.style.height = isCircle ? size + 'px' : size * 2.5 + 'px';
        el.style.borderRadius = isCircle ? '50%' : '2px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.left = (10 + Math.random() * 80) + '%';
        el.style.top = '-10px';
        el.style.setProperty('--confetti-x', (Math.random() - 0.5) * 400 + 'px');
        el.style.setProperty('--confetti-r', Math.random() * 720 - 360 + 'deg');
        el.style.animationDuration = (2 + Math.random() * 2.5) + 's';
        el.style.animationDelay = (Math.random() * 0.6) + 's';
        container.appendChild(el);
    }
    setTimeout(() => { container.innerHTML = ''; }, 6000);
}

function spawnWinParticles() {
    const container = document.getElementById('confetti-container');
    for (let i = 0; i < 25; i++) {
        const el = document.createElement('div');
        el.className = 'win-particle';
        const angle = Math.random() * 360;
        const dist = 60 + Math.random() * 250;
        el.style.setProperty('--px', Math.cos(angle * Math.PI / 180) * dist + 'px');
        el.style.setProperty('--py', Math.sin(angle * Math.PI / 180) * dist + 'px');
        el.style.left = '50%';
        el.style.top = '50%';
        el.style.animationDelay = Math.random() * 0.3 + 's';
        container.appendChild(el);
    }
}

// ══════════════════════════════════════════
// BOARD GENERATION
// ══════════════════════════════════════════
function buildBoard() {
    const container = document.getElementById('roulette-board');
    container.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'board-grid';

    // Zero
    const zeroCell = document.createElement('div');
    zeroCell.className = 'board-cell green zero-cell';
    zeroCell.textContent = '0';
    zeroCell.id = 'cell-0';
    zeroCell.onclick = () => placeBetOnBoard('straight', 0);
    grid.appendChild(zeroCell);

    const rows = [
        [3,6,9,12,15,18,21,24,27,30,33,36],
        [2,5,8,11,14,17,20,23,26,29,32,35],
        [1,4,7,10,13,16,19,22,25,28,31,34],
    ];

    rows.forEach((row, rowIdx) => {
        row.forEach((num, colIdx) => {
            const cell = document.createElement('div');
            cell.className = `board-cell ${getNumberColor(num)}`;
            cell.textContent = num;
            cell.id = `cell-${num}`;
            cell.style.gridRow = rowIdx + 1;
            cell.style.gridColumn = colIdx + 2;
            cell.onclick = () => placeBetOnBoard('straight', num);
            grid.appendChild(cell);
        });

        const colCell = document.createElement('div');
        colCell.className = 'board-cell col-cell';
        colCell.textContent = '2:1';
        colCell.style.gridRow = rowIdx + 1;
        colCell.style.gridColumn = 14;
        const colNum = 3 - rowIdx;
        colCell.onclick = () => placeBetOnBoard('column', colNum);
        grid.appendChild(colCell);
    });

    container.appendChild(grid);

    // Dozen row
    const dozenRow = document.createElement('div');
    dozenRow.className = 'board-bottom';
    dozenRow.innerHTML = '<div></div>';
    [{label:'1st 12',value:1},{label:'2nd 12',value:2},{label:'3rd 12',value:3}].forEach(d => {
        const cell = document.createElement('div');
        cell.className = 'board-cell outside';
        cell.textContent = d.label;
        cell.onclick = () => placeBetOnBoard('dozen', d.value);
        dozenRow.appendChild(cell);
    });
    dozenRow.innerHTML += '<div></div>';
    container.appendChild(dozenRow);

    // Outside bets row
    const outsideRow = document.createElement('div');
    outsideRow.className = 'board-outside';
    outsideRow.innerHTML = '<div></div>';
    [
        {label:'1-18',type:'low'},{label:'PAR',type:'even'},
        {label:'◆ ROȘU',type:'red',cls:'red-bet'},{label:'◆ NEGRU',type:'black',cls:'black-bet'},
        {label:'IMPAR',type:'odd'},{label:'19-36',type:'high'},
    ].forEach(b => {
        const cell = document.createElement('div');
        cell.className = `board-cell outside ${b.cls||''}`;
        cell.textContent = b.label;
        cell.onclick = () => placeBetOnBoard(b.type, null);
        outsideRow.appendChild(cell);
    });
    outsideRow.innerHTML += '<div></div>';
    container.appendChild(outsideRow);
}
buildBoard();

// ══════════════════════════════════════════
// BET FUNCTIONS
// ══════════════════════════════════════════
function selectChip(amount, el) {
    selectedChipAmount = amount;
    document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
}

function placeBetOnBoard(betType, betValue) {
    if (typeof mp !== 'undefined') {
        mp.trigger('Roulette_PlaceBet', betType, JSON.stringify(betValue), selectedChipAmount);
    } else {
        console.log('[TEST] Bet:', betType, betValue, selectedChipAmount);
    }
}

function clearAllBets() {
    if (typeof mp !== 'undefined') {
        mp.trigger('Roulette_ClearBets');
    } else {
        console.log('[TEST] Clear bets');
    }
}

// ══════════════════════════════════════════
// UI UPDATES FROM SERVER
// ══════════════════════════════════════════
function updateGameState(stateJson) {
    const state = JSON.parse(stateJson);
    const stateUpper = (state.state || 'waiting').toUpperCase();
    document.getElementById('phase-label').textContent =
        stateUpper === 'BETTING' ? 'PLASAȚI PARIURILE' :
        stateUpper === 'SPINNING' ? 'BILA SE ÎNVÂRTE' :
        stateUpper === 'RESULT' ? 'REZULTAT' : 'AȘTEPTARE';
    renderPlayerList(state.players || []);
    renderHistory(state.history || []);
}

function updateMyBets(betsJson, chips, totalBet) {
    myBets = JSON.parse(betsJson);
    myChips = chips;
    myTotalBet = totalBet;
    document.getElementById('chips-value').textContent = `$${chips.toLocaleString('en-US')}`;
    document.getElementById('bet-value').textContent = `$${totalBet.toLocaleString('en-US')}`;
    document.querySelectorAll('.chip-indicator').forEach(el => el.remove());
    myBets.forEach(bet => {
        if (bet.type === 'straight' && bet.value !== undefined) {
            const cell = document.getElementById(`cell-${bet.value}`);
            if (cell) addChipIndicator(cell, bet.amount);
        }
    });
}

function addChipIndicator(cell, amount) {
    let indicator = cell.querySelector('.chip-indicator');
    if (indicator) {
        const current = parseInt(indicator.textContent.replace(/[^0-9]/g,'')) || 0;
        indicator.textContent = formatCompact(current + amount);
    } else {
        indicator = document.createElement('div');
        indicator.className = 'chip-indicator';
        indicator.textContent = formatCompact(amount);
        cell.appendChild(indicator);
    }
}

function formatCompact(n) {
    if (n >= 1000) return (n/1000).toFixed(0) + 'K';
    return String(n);
}

// ══════════════════════════════════════════
// BETTING PHASE
// ══════════════════════════════════════════
function onBettingStart(betTime) {
    timerTotal = betTime;
    document.getElementById('timer-wrap').classList.add('visible');
    document.getElementById('timer-label').textContent = 'Plasați pariurile';
    document.getElementById('timer-num').textContent = betTime;

    document.getElementById('roulette-board').classList.add('visible');
    document.getElementById('bet-selector').classList.add('visible');
    document.getElementById('actions').classList.add('visible');

    document.getElementById('wheel-container').classList.remove('visible');
    document.getElementById('result-banner').classList.remove('visible');

    document.querySelectorAll('.board-cell.winning').forEach(el => el.classList.remove('winning'));

    const ball = document.getElementById('ball');
    ball.style.display = 'none';
    ball.style.opacity = '0';
    ball.classList.remove('settled');
    document.getElementById('wheel-glow').style.opacity = '0';

    showToast('Plasați pariurile!', 2000);
}

function updateBetTimer(timeLeft) {
    const wrap = document.getElementById('timer-wrap');
    const fillEl = document.getElementById('fill');
    const numEl = document.getElementById('timer-num');

    if (timeLeft <= 0) { wrap.classList.remove('visible'); return; }

    wrap.classList.add('visible');
    numEl.textContent = timeLeft;
    fillEl.style.strokeDasharray = CIRCUMFERENCE;
    const ratio = timeLeft / timerTotal;
    fillEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);

    if (ratio < 0.2) fillEl.style.stroke = '#e74c3c';
    else if (ratio < 0.5) fillEl.style.stroke = '#f39c12';
    else fillEl.style.stroke = 'var(--gold)';

    if (timeLeft <= 5) document.getElementById('timer-label').textContent = 'Ultimele secunde!';
}

// ══════════════════════════════════════════
// SPIN PHASE — Real Wheel Animation
// ══════════════════════════════════════════
function onSpinStart(winningNumber, winningColor, spinTime) {
    document.getElementById('roulette-board').classList.remove('visible');
    document.getElementById('bet-selector').classList.remove('visible');
    document.getElementById('actions').classList.remove('visible');
    document.getElementById('timer-wrap').classList.remove('visible');
    document.getElementById('result-banner').classList.remove('visible');

    const wc = document.getElementById('wheel-container');
    wc.classList.add('visible');

    const ws = document.getElementById('wheel-status');
    ws.textContent = 'BILA SE ÎNVÂRTE...';
    ws.classList.add('visible');

    if (wheelAnimFrame) { cancelAnimationFrame(wheelAnimFrame); wheelAnimFrame = null; }

    animateWheel(winningNumber, spinTime, () => {
        const colorName = winningColor === 'red' ? 'ROȘU' : winningColor === 'black' ? 'NEGRU' : 'VERDE';
        ws.innerHTML = `<span class="result-flash ${winningColor}">${winningNumber}</span> — ${colorName}`;
    });
}

function onShowResult(number, color, stateJson) {
    const state = JSON.parse(stateJson);
    document.getElementById('wheel-status').classList.remove('visible');

    const banner = document.getElementById('result-banner');
    const numEl = document.getElementById('result-number');
    numEl.className = color;
    numEl.textContent = number;

    const colorName = color === 'red' ? 'Roșu' : color === 'black' ? 'Negru' : 'Verde';
    document.getElementById('result-text').textContent = `${number} — ${colorName}`;

    let myWin = 0;
    myBets.forEach(bet => {
        if (bet.numbers && bet.numbers.includes(number)) {
            myWin += bet.amount + (bet.amount * bet.payout);
        }
    });

    const winEl = document.getElementById('result-win');
    if (myWin > 0) {
        winEl.textContent = `+$${myWin.toLocaleString('en-US')}`;
        winEl.style.color = '#27ae60';
        winEl.className = 'win-glow';
        spawnConfetti(80, color);
        spawnWinParticles();
    } else if (myTotalBet > 0) {
        winEl.textContent = `-$${myTotalBet.toLocaleString('en-US')}`;
        winEl.style.color = '#e74c3c';
        winEl.className = '';
    } else {
        winEl.textContent = '';
        winEl.className = '';
    }

    document.getElementById('result-glow').className = `glow-${color}`;
    banner.classList.add('visible');

    document.getElementById('roulette-board').classList.add('visible');
    const winCell = document.getElementById(`cell-${number}`);
    if (winCell) winCell.classList.add('winning');

    clearTimeout(resultBannerTimeout);
    resultBannerTimeout = setTimeout(() => {
        banner.classList.remove('visible');
        document.getElementById('wheel-container').classList.remove('visible');
    }, 5000);

    renderPlayerList(state.players || []);
    renderHistory(state.history || []);

    myBets = [];
    myTotalBet = 0;
    document.querySelectorAll('.chip-indicator').forEach(el => el.remove());
}

// ══════════════════════════════════════════
// PLAYER LIST
// ══════════════════════════════════════════
function renderPlayerList(players) {
    const container = document.getElementById('pl-rows');
    container.innerHTML = '';
    players.forEach(p => {
        const row = document.createElement('div');
        row.className = 'pl-row';
        row.innerHTML = `
            <div class="pl-avatar">${escHtml(p.name.charAt(0).toUpperCase())}</div>
            <div class="pl-info">
                <div class="pl-name">${escHtml(p.name)}</div>
                <div class="pl-chips">$${p.chips.toLocaleString('en-US')}${p.totalBet>0?` <span style="color:var(--gold-lt)">bet $${p.totalBet}</span>`:''}</div>
            </div>
            ${p.lastWin>0?`<div class="pl-win">+$${p.lastWin.toLocaleString('en-US')}</div>`:''}`;
        container.appendChild(row);
    });
}

// ══════════════════════════════════════════
// HISTORY
// ══════════════════════════════════════════
function renderHistory(history) {
    const container = document.getElementById('history-items');
    container.innerHTML = '';
    history.forEach((h, i) => {
        const el = document.createElement('div');
        el.className = `history-num ${h.color}`;
        el.textContent = h.number;
        if (i === 0) el.classList.add('new-entry');
        container.appendChild(el);
    });
}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function showToast(msg, duration) {
    clearTimeout(toastTimeout);
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    toastTimeout = setTimeout(() => el.classList.remove('show'), duration || 2500);
}

function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function leaveTable() {
    if (typeof mp !== 'undefined') mp.trigger('Roulette_LeaveTable');
}

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
        if (document.activeElement && document.activeElement.tagName === 'BUTTON') e.preventDefault();
    }
});
document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
