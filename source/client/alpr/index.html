<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: transparent;
        font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        color: #e0e0e0;
        overflow: hidden;
        user-select: none;
    }

    #alpr-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 420px;
        background: linear-gradient(135deg, rgba(15, 18, 30, 0.92) 0%, rgba(20, 25, 45, 0.95) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        display: none;
        overflow: hidden;
    }

    #alpr-container.visible { display: block; }

    /* Header */
    .alpr-header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    .alpr-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .alpr-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #3b82f6;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .alpr-title {
        font-size: 18px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 2px;
    }
    .alpr-subtitle {
        font-size: 11px;
        color: #6b7280;
        margin-top: 2px;
    }
    .speed-display {
        text-align: right;
    }
    .speed-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 700;
        color: #f0f0f0;
        line-height: 1;
    }
    .speed-unit {
        font-size: 11px;
        color: #6b7280;
        font-weight: 500;
        letter-spacing: 1px;
    }

    /* Plate Section */
    .plate-section {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .plate-label {
        font-size: 10px;
        font-weight: 600;
        color: #6b7280;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
    }
    .plate-number {
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 3px;
    }
    .plate-badges {
        margin-top: 8px;
        display: flex;
        gap: 8px;
    }
    .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .badge-danger {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge-success {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
        border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge-warning {
        background: rgba(234, 179, 8, 0.2);
        color: #eab308;
        border: 1px solid rgba(234, 179, 8, 0.3);
    }

    /* Info Grid */
    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        margin: 0 16px 12px;
        background: rgba(255,255,255,0.04);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
        margin-top: 12px;
    }
    .info-card {
        background: rgba(15, 18, 30, 0.6);
        padding: 12px 14px;
    }
    .info-card-title {
        font-size: 11px;
        font-weight: 700;
        color: #9ca3af;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }
    .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 0;
    }
    .info-label {
        font-size: 12px;
        color: #6b7280;
    }
    .info-value {
        font-size: 12px;
        font-weight: 600;
        color: #e5e7eb;
        text-align: right;
    }

    /* Notes */
    .notes-section {
        margin: 0 16px 14px;
        background: rgba(234, 179, 8, 0.06);
        border: 1px solid rgba(234, 179, 8, 0.15);
        border-radius: 10px;
        padding: 12px 14px;
    }
    .notes-title {
        font-size: 12px;
        font-weight: 700;
        color: #eab308;
        margin-bottom: 6px;
    }
    .notes-text {
        font-size: 12px;
        color: #d1d5db;
        line-height: 1.5;
    }

    /* Footer */
    .alpr-footer {
        padding: 10px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: #4b5563;
    }

    /* No target state */
    .no-target {
        padding: 40px 20px;
        text-align: center;
        color: #4b5563;
        font-size: 13px;
    }
    .no-target .scan-icon {
        font-size: 36px;
        margin-bottom: 10px;
        opacity: 0.4;
    }

    /* Scan animation */
    .scanning {
        position: relative;
    }
    .scanning::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        animation: scan-line 2s infinite;
    }
    @keyframes scan-line {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }
</style>
</head>
<body>
<div id="alpr-container">
    <!-- Header -->
    <div class="alpr-header">
        <div>
            <div class="alpr-title-row">
                <div class="alpr-dot"></div>
                <span class="alpr-title">ALPR</span>
            </div>
            <div class="alpr-subtitle" id="lastScan">Ultima scanare: --:--:-- --</div>
        </div>
        <div class="speed-display">
            <div class="speed-value" id="speedValue">---</div>
            <div class="speed-unit">MPH</div>
        </div>
    </div>

    <!-- Content area -->
    <div id="alpr-content">
        <div class="no-target" id="noTarget">
            <div class="scan-icon">◎</div>
            <div>Se scaneaza... Indreapta vehiculul spre un alt vehicul.</div>
        </div>

        <div id="vehicleData" style="display:none;">
            <!-- Plate -->
            <div class="plate-section">
                <div class="plate-label">PLĂCUȚĂ</div>
                <div class="plate-number" id="plateNumber">---</div>
                <div class="plate-badges" id="badges"></div>
            </div>

            <!-- Info Grid -->
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-card-title">Vehicul</div>
                    <div class="info-row"><span class="info-label">Model</span><span class="info-value" id="vModel">-</span></div>
                    <div class="info-row"><span class="info-label">Culoare</span><span class="info-value" id="vColor">-</span></div>
                    <div class="info-row"><span class="info-label">VIN</span><span class="info-value" id="vVin">-</span></div>
                    <div class="info-row"><span class="info-label">An</span><span class="info-value" id="vYear">-</span></div>
                </div>
                <div class="info-card">
                    <div class="info-card-title">Proprietar</div>
                    <div class="info-row"><span class="info-label">Nume</span><span class="info-value" id="oName">-</span></div>
                    <div class="info-row"><span class="info-label">ID</span><span class="info-value" id="oId">-</span></div>
                    <div class="info-row"><span class="info-label">Permis</span><span class="info-value" id="oLicense">-</span></div>
                </div>
            </div>

            <!-- Notes -->
            <div class="notes-section" id="notesSection" style="display:none;">
                <div class="notes-title">Notițe</div>
                <div class="notes-text" id="notesText"></div>
            </div>
        </div>
    </div>

    <div class="alpr-footer">Control: /alpr ON/OFF</div>
</div>

<script>
    const container = document.getElementById('alpr-container');
    const noTarget = document.getElementById('noTarget');
    const vehicleData = document.getElementById('vehicleData');

    function show() {
        container.classList.add('visible');
    }

    function hide() {
        container.classList.remove('visible');
        resetData();
    }

    function resetData() {
        noTarget.style.display = '';
        vehicleData.style.display = 'none';
        document.getElementById('speedValue').textContent = '---';
        document.getElementById('lastScan').textContent = 'Ultima scanare: --:--:-- --';
    }

    function updateSpeed(speed) {
        document.getElementById('speedValue').textContent = Math.round(speed);
    }

    function updateScanTime() {
        const now = new Date();
        const h = now.getHours();
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        document.getElementById('lastScan').textContent =
            `Ultima scanare: ${h12}:${m}:${s} ${ampm}`;
    }

    function updateVehicleData(data) {
        noTarget.style.display = 'none';
        vehicleData.style.display = '';
        updateScanTime();

        document.getElementById('plateNumber').textContent = data.plate || '---';

        // Badges
        const badgesEl = document.getElementById('badges');
        badgesEl.innerHTML = '';
        if (data.insurance === false) {
            badgesEl.innerHTML += '<span class="badge badge-danger">NEASIGURAT</span>';
        } else {
            badgesEl.innerHTML += '<span class="badge badge-success">ASIGURAT</span>';
        }
        if (data.wanted) {
            badgesEl.innerHTML += '<span class="badge badge-danger">CAUTAT</span>';
        }
        if (data.stolen) {
            badgesEl.innerHTML += '<span class="badge badge-warning">FURAT</span>';
        }

        // Vehicle info
        document.getElementById('vModel').textContent = data.model || '-';
        document.getElementById('vColor').textContent = data.color || '-';
        document.getElementById('vVin').textContent = data.vin || '-';
        document.getElementById('vYear').textContent = data.year || '-';

        // Owner info
        document.getElementById('oName').textContent = data.ownerName || '-';
        document.getElementById('oId').textContent = data.ownerId || '-';

        const licEl = document.getElementById('oLicense');
        licEl.textContent = data.license || '-';
        licEl.style.color = data.license === 'VALID' ? '#22c55e' : '#ef4444';

        // Notes
        const notesSection = document.getElementById('notesSection');
        if (data.notes) {
            notesSection.style.display = '';
            document.getElementById('notesText').textContent = data.notes;
        } else {
            notesSection.style.display = 'none';
        }
    }

    function clearTarget() {
        noTarget.style.display = '';
        vehicleData.style.display = 'none';
    }
</script>
</body>
</html>
