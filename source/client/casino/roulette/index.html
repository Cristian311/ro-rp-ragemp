<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
    --accent: #ff6b00;
    --accent-lt: #ff9a40;
    --accent-dk: #cc5500;
    --red: #c0392b;
    --red-lt: #e74c3c;
    --green: #27ae60;
    --green-lt: #2ecc71;
    --bg: #0a0a0a;
    --surface: rgba(10, 10, 10, 0.92);
    --surface2: rgba(18, 18, 18, 0.88);
    --border: rgba(255, 107, 0, 0.12);
    --border-hl: rgba(255, 107, 0, 0.4);
    --text: #e8e8e8;
    --text2: #777;
    --glow: rgba(255, 107, 0, 0.25);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: transparent;
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    pointer-events: none;
    width: 100vw; height: 100vh;
    color: var(--text);
    display: flex;
    flex-direction: column;
}

/* ── TOPBAR ── */
#topbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 2vw;
    background: linear-gradient(180deg, rgba(10,10,10,0.96), rgba(10,10,10,0.88));
    display: flex; align-items: center; gap: 0.7vw;
    padding: 0 1vw;
    border-bottom: 1px solid var(--border);
    z-index: 100;
    backdrop-filter: blur(14px);
}
.logo {
    font-family: 'Bebas Neue', sans-serif;
    color: var(--accent);
    font-size: 1.05vw;
    letter-spacing: 0.15vw;
    text-shadow: 0 0 0.7vw var(--glow);
}

/* ── STATUS BANNER ── */
#status-banner {
    position: fixed; top: 2.4vw; left: 50%;
    padding: 0.26vw 1.15vw;
    border-radius: 0.85vw;
    font-size: 0.57vw; font-weight: 700;
    letter-spacing: 0.09vw;
    text-transform: uppercase;
    z-index: 95;
    opacity: 0; transform: translateX(-50%) translateY(-0.4vw);
    transition: all 0.35s cubic-bezier(.4,0,.2,1);
    backdrop-filter: blur(8px);
}
#status-banner.visible {
    opacity: 1; transform: translateX(-50%) translateY(0);
}
#status-banner.betting {
    background: linear-gradient(135deg, rgba(39,174,96,0.15), rgba(46,204,113,0.08));
    border: 1px solid rgba(46,204,113,0.35);
    color: var(--green-lt);
    box-shadow: 0 0 0.95vw rgba(46,204,113,0.12);
}
#status-banner.spinning {
    background: linear-gradient(135deg, rgba(255,107,0,0.15), rgba(255,107,0,0.06));
    border: 1px solid rgba(255,107,0,0.35);
    color: var(--accent-lt);
    box-shadow: 0 0 0.95vw rgba(255,107,0,0.12);
    animation: spinPulse 1.5s ease-in-out infinite;
}
@keyframes spinPulse {
    0%, 100% { box-shadow: 0 0 0.95vw rgba(255,107,0,0.12); }
    50% { box-shadow: 0 0 1.7vw rgba(255,107,0,0.28); }
}

/* ── CHIPS INFO ── */
#chips-info {
    display: none;
}
.info-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.42vw; padding: 0.36vw 0.63vw; text-align: center;
    backdrop-filter: blur(8px);
    min-width: 3.9vw;
}
.info-label {
    color: var(--text2); font-size: 0.42vw; text-transform: uppercase;
    letter-spacing: 0.06vw; margin-bottom: 0.1vw;
}
.info-value { color: var(--accent-lt); font-size: 0.83vw; font-weight: 700; }

/* ── CHIP SELECTOR BAR ── */
#chip-selector {
    position: fixed; bottom: 3.1vw; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 0.42vw;
    z-index: 95;
    opacity: 0; transition: opacity 0.3s, transform 0.4s cubic-bezier(.4,0,.2,1);
    transform: translateX(-50%) translateY(3.1vw) scale(1.5);
}
#chip-selector.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1.5);
}
.chip-sel-arrow {
    color: var(--accent); font-size: 0.95vw; font-weight: 800;
    text-shadow: 0 0 0.52vw var(--glow);
    animation: arrowPulse 1.5s ease-in-out infinite;
    transition: transform 0.15s ease-out;
}
.chip-sel-arrow.bounce-left {
    animation: arrowBounceLeft 0.3s cubic-bezier(.4,0,.2,1);
}
.chip-sel-arrow.bounce-right {
    animation: arrowBounceRight 0.3s cubic-bezier(.4,0,.2,1);
}
@keyframes arrowBounceLeft {
    0% { transform: translateX(0); }
    40% { transform: translateX(-0.4vw) scale(1.3); }
    100% { transform: translateX(0) scale(1); }
}
@keyframes arrowBounceRight {
    0% { transform: translateX(0); }
    40% { transform: translateX(0.4vw) scale(1.3); }
    100% { transform: translateX(0) scale(1); }
}
@keyframes arrowPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}
#chip-tray {
    display: flex; align-items: center; gap: 0.31vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1.46vw;
    padding: 0.5vw 0.7vw;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: visible;
}
.chip-sel-item {
    width: 3vw; height: 3vw; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 0.1vw solid transparent;
    transition: all 0.3s cubic-bezier(.4,0,.2,1);
    opacity: 0.45;
    transform: scale(0.82);
    cursor: default;
    background: none;
    padding: 0;
    flex-shrink: 0;
}
.chip-sel-item img {
    width: 100%; height: 100%;
    border-radius: 50%;
    pointer-events: none;
    filter: drop-shadow(0 0.1vw 0.2vw rgba(0,0,0,0.5));
}
.chip-sel-item.active {
    opacity: 1;
    transform: scale(1.2);
    border-color: var(--accent);
    box-shadow: 0 0 0.95vw var(--glow), 0 0 0.31vw var(--accent);
    filter: brightness(1.15);
}
.chip-sel-item.slide-left {
    animation: chipSlideLeft 0.25s cubic-bezier(.4,0,.2,1);
}
.chip-sel-item.slide-right {
    animation: chipSlideRight 0.25s cubic-bezier(.4,0,.2,1);
}
@keyframes chipSlideLeft {
    0% { transform: scale(0.82) translateX(1vw); opacity: 0; }
    100% { transform: scale(1.2) translateX(0); opacity: 1; }
}
@keyframes chipSlideRight {
    0% { transform: scale(0.82) translateX(-1vw); opacity: 0; }
    100% { transform: scale(1.2) translateX(0); opacity: 1; }
}
.chip-sel-label {
    position: absolute; bottom: -0.95vw; left: 50%; transform: translateX(-50%);
    color: var(--accent-lt); font-size: 0.68vw; font-weight: 700;
    white-space: nowrap;
    text-shadow: 0 0 0.42vw rgba(255,107,0,0.4);
}

/* ── TIMER ── */
#timer-wrap {
    position: fixed; top: 4.2vw; left: 50%;
    transform: translateX(-50%);
    display: none; flex-direction: column; align-items: center; gap: 0.21vw;
    z-index: 90;
}
#timer-wrap.visible { display: flex; }
#timer-ring { position: relative; width: 2.7vw; height: 2.7vw; }
#timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 3.5; }
#fill { fill: none; stroke: var(--accent); stroke-width: 3.5;
    stroke-dasharray: 150.80; stroke-dashoffset: 0;
    stroke-linecap: round; transition: stroke-dashoffset 0.5s linear, stroke 0.3s; }
#timer-num {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 0.89vw; font-weight: 800;
    font-family: 'Bebas Neue', sans-serif;
}
#timer-label { color: var(--accent); font-size: 0.47vw; text-align: center; letter-spacing: 0.026vw; }

/* ── MY BETS PANEL ── */
#my-bets-panel {
    position: fixed; right: 0.83vw; top: 9.9vw;
    width: 11.2vw; max-height: 24vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.52vw;
    z-index: 90;
    backdrop-filter: blur(10px);
    overflow: hidden;
    display: flex; flex-direction: column;
    opacity: 0; transform: translateX(0.63vw);
    transition: all 0.35s cubic-bezier(.4,0,.2,1);
}
#my-bets-panel.visible { opacity: 1; transform: translateX(0); }
.bets-header {
    padding: 0.36vw 0.63vw;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.bets-title {
    color: var(--accent); font-size: 0.52vw; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08vw;
}
.bets-count {
    background: rgba(255,107,0,0.12);
    color: var(--accent-lt); font-size: 0.47vw; font-weight: 700;
    padding: 0.1vw 0.42vw; border-radius: 0.52vw;
}
#bets-list {
    flex: 1; overflow-y: auto; padding: 0.16vw 0;
}
#bets-list::-webkit-scrollbar { width: 0.16vw; }
#bets-list::-webkit-scrollbar-track { background: transparent; }
#bets-list::-webkit-scrollbar-thumb { background: rgba(255,107,0,0.25); border-radius: 0.16vw; }
.bet-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.26vw 0.63vw;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    animation: betSlideIn 0.25s ease-out;
}
@keyframes betSlideIn {
    from { opacity: 0; transform: translateX(-0.42vw); }
    to { opacity: 1; transform: translateX(0); }
}
.bet-zone { display: flex; align-items: center; gap: 0.31vw; }
.bet-zone-dot {
    width: 0.42vw; height: 0.42vw; border-radius: 50%; flex-shrink: 0;
}
.bet-zone-dot.red { background: var(--red); }
.bet-zone-dot.black { background: #1a1a1a; border: 1px solid rgba(255,255,255,0.2); }
.bet-zone-dot.green { background: var(--green); }
.bet-zone-dot.mixed { background: linear-gradient(135deg, var(--accent-dk), var(--accent)); }
.bet-zone-name { color: var(--text); font-size: 0.57vw; font-weight: 500; }
.bet-amount { color: var(--accent-lt); font-size: 0.57vw; font-weight: 700; }
.bet-count-badge {
    color: var(--text2); font-size: 0.47vw; font-weight: 600;
    margin-left: 0.21vw;
}
.bets-footer {
    padding: 0.36vw 0.63vw;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
}
.bets-total-label { color: var(--text2); font-size: 0.47vw; text-transform: uppercase; letter-spacing: 0.05vw; }
.bets-total-value { color: var(--accent-lt); font-size: 0.78vw; font-weight: 800; }
.bets-empty {
    padding: 0.73vw 0.63vw; text-align: center;
    color: var(--text2); font-size: 0.57vw; font-style: italic;
}

/* ── RIGHT SIDE CONTAINER ── */
#right-panel {
    position: fixed; right: 0.83vw;
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-end; gap: 0.5vw;
    z-index: 90;
    width: 11vw;
}

/* ── PLAYER LIST ── */
#player-list {
    width: 9.1vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.52vw; overflow: hidden;
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column;
}
.pl-header {
    padding: 0.36vw 0.63vw; color: var(--accent); font-size: 0.52vw; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08vw;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.pl-row {
    display: flex; align-items: center; gap: 0.42vw;
    padding: 0.26vw 0.63vw;
    border-bottom: 1px solid rgba(255,255,255,0.03);
}
.pl-avatar {
    width: 1.25vw; height: 1.25vw; border-radius: 50%;
    background: rgba(255,107,0,0.1); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.52vw; font-weight: 700;
    border: 1px solid rgba(255,107,0,0.2);
    flex-shrink: 0;
}
.pl-name { color: #fff; font-size: 0.57vw; font-weight: 500; }
.pl-chips { color: var(--text2); font-size: 0.52vw; }
.pl-win { color: var(--green-lt); font-size: 0.57vw; font-weight: 600; margin-left: auto; }

/* ── HISTORY ── */
#history {
    width: 15vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.52vw;
    padding: 0.42vw 0.52vw;
    backdrop-filter: blur(10px);
}
.h-title {
    color: var(--accent); font-size: 0.47vw; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08vw; margin-bottom: 0.26vw;
}
#history-items { display: flex; flex-wrap: wrap; gap: 0.21vw; }
.history-num {
    width: 1.35vw; height: 1.35vw; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.47vw; font-weight: 700; color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 0.1vw 0.26vw rgba(0,0,0,0.35);
    flex-shrink: 0;
}
.history-num.red { background: var(--red); }
.history-num.black { background: #151515; }
.history-num.green { background: var(--green); }
.history-num:first-child {
    border-color: var(--accent);
    box-shadow: 0 0 0.52vw var(--glow);
}
.history-num.new-entry { animation: histPop 0.4s cubic-bezier(.4,0,.2,1); }
@keyframes histPop { from { transform: scale(0) rotate(-15deg); } to { transform: scale(1) rotate(0); } }

/* ── RESULT BANNER ── */
#result-banner {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 1.05vw 2.1vw;
    border-radius: 0.73vw;
    background: rgba(10, 10, 10, 0.95);
    border: 1px solid var(--border-hl);
    backdrop-filter: blur(16px);
    z-index: 200;
    opacity: 0;
    transition: all 0.4s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
}
#result-banner.visible {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
}
#result-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8vw; font-weight: 800; margin-bottom: 0.1vw;
}
#result-number.red { color: var(--red-lt); }
#result-number.black { color: #ecf0f1; }
#result-number.green { color: var(--green-lt); }
#result-text { color: var(--text2); font-size: 0.63vw; }
#result-win { font-size: 1.15vw; font-weight: 700; margin-top: 0.42vw; }
.win-glow { animation: pulseGlow 1s ease-in-out infinite alternate; }
@keyframes pulseGlow {
    from { text-shadow: 0 0 0.52vw rgba(39,174,96,0.5); }
    to { text-shadow: 0 0 1.56vw rgba(39,174,96,1); }
}
#result-glow {
    position: absolute; inset: -0.21vw; border-radius: 0.95vw;
    opacity: 0.2; z-index: -1;
}
.glow-red { background: radial-gradient(circle, rgba(231,76,60,0.35), transparent 70%); }
.glow-black { background: radial-gradient(circle, rgba(200,200,200,0.1), transparent 70%); }
.glow-green { background: radial-gradient(circle, rgba(46,204,113,0.35), transparent 70%); }

/* ── CONTROLS HINT ── */
#controls-hint {
    display: flex; gap: 0.52vw; align-items: center;
    width: 15vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.95vw;
    padding: 0.26vw 0.73vw;
    backdrop-filter: blur(8px);
}
.ctrl-item { display: flex; align-items: center; gap: 0.21vw; }
.ctrl-key {
    background: rgba(255,107,0,0.1);
    color: var(--accent);
    font-size: 0.47vw; font-weight: 700;
    padding: 0.1vw 0.31vw; border-radius: 0.21vw;
    border: 1px solid rgba(255,107,0,0.2);
}
.ctrl-desc { color: var(--text2); font-size: 0.47vw; }

/* ── CONFETTI ── */
#confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
.confetti { position: absolute; animation: confettiFall 3s ease-out forwards; }
@keyframes confettiFall {
    0% { transform: translateY(0) translateX(0) rotate(0); opacity: 1; }
    100% { transform: translateY(100vh) translateX(var(--confetti-x)) rotate(var(--confetti-r)); opacity: 0; }
}
.win-particle {
    position: absolute; width: 0.31vw; height: 0.31vw; border-radius: 50%;
    background: var(--accent); animation: particleBurst 0.8s ease-out forwards;
}
@keyframes particleBurst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
}

/* ── TOAST ── */
#toast {
    position: fixed; bottom: 5.2vw; left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--accent-lt);
    padding: 0.42vw 1.05vw; border-radius: 0.95vw; font-size: 0.63vw; font-weight: 600;
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.3s; z-index: 150;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- STATUS BANNER -->
<div id="status-banner"></div>

<!-- CHIPS INFO -->
<div id="chips-info">
    <div class="info-box">
        <div class="info-label">Chips</div>
        <div class="info-value" id="chips-value">$0</div>
    </div>
    <div class="info-box">
        <div class="info-label">Pariu Total</div>
        <div class="info-value" id="bet-value">$0</div>
    </div>
</div>

<!-- CHIP SELECTOR BAR -->
<div id="chip-selector">
    <div class="chip-sel-arrow" id="arrow-left">&laquo;</div>
    <div id="chip-tray">
        <div class="chip-sel-item" data-amount="50"><img src="chips/50.png" alt="$50"></div>
        <div class="chip-sel-item" data-amount="100"><img src="chips/100.png" alt="$100"></div>
        <div class="chip-sel-item" data-amount="500"><img src="chips/500.png" alt="$500"></div>
        <div class="chip-sel-item" data-amount="1000"><img src="chips/1k.png" alt="$1K"></div>
        <div class="chip-sel-item" data-amount="2000"><img src="chips/2k.png" alt="$2K"></div>
        <div class="chip-sel-item" data-amount="3000"><img src="chips/3k.png" alt="$3K"></div>
        <div class="chip-sel-item" data-amount="5000"><img src="chips/5k.png" alt="$5K"></div>
    </div>
    <div class="chip-sel-arrow" id="arrow-right">&raquo;</div>
</div>

<!-- TIMER -->
<div id="timer-wrap">
    <div id="timer-ring">
        <svg width="52" height="52" viewBox="0 0 54 54">
            <circle id="track" cx="27" cy="27" r="24"/>
            <circle id="fill" cx="27" cy="27" r="24"/>
        </svg>
        <div id="timer-num">30</div>
    </div>
    <div id="timer-label">Plasati pariurile</div>
</div>

<!-- MY BETS PANEL -->
<div id="my-bets-panel">
    <div class="bets-header">
        <span class="bets-title">Pariurile Tale</span>
        <span class="bets-count" id="bets-count">0</span>
    </div>
    <div id="bets-list">
        <div class="bets-empty">Niciun pariu plasat</div>
    </div>
    <div class="bets-footer">
        <div>
            <div class="bets-total-label">Total</div>
            <div class="bets-total-value" id="bets-total">$0</div>
        </div>
    </div>
</div>

<!-- RIGHT SIDE PANEL -->
<div id="right-panel">
    <!-- PLAYER LIST -->
    <div id="player-list">
        <div class="pl-header">Jucatori</div>
        <div id="pl-rows"></div>
    </div>

    <!-- HISTORY -->
    <div id="history">
        <div class="h-title">Istoric Masa</div>
        <div id="history-items"></div>
    </div>

    <!-- CONTROLS HINT -->
    <div id="controls-hint">
        <div class="ctrl-item"><span class="ctrl-key">LMB</span><span class="ctrl-desc">Pariu</span></div>
        <div class="ctrl-item"><span class="ctrl-key">&larr; &rarr;</span><span class="ctrl-desc">Chip</span></div>
        <div class="ctrl-item"><span class="ctrl-key">C</span><span class="ctrl-desc">Sterge</span></div>
        <div class="ctrl-item"><span class="ctrl-key">ESC</span><span class="ctrl-desc">Iesire</span></div>
    </div>
</div>

<!-- RESULT BANNER -->
<div id="result-banner">
    <div id="result-glow"></div>
    <div id="result-number">0</div>
    <div id="result-text"></div>
    <div id="result-win"></div>
</div>

<!-- CONFETTI -->
<div id="confetti-container"></div>

<!-- TOAST -->

<script>
var CHIP_AMOUNTS = [50, 100, 500, 1000, 2000, 3000, 5000];
var RED_NUMBERS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
var CIRCUMFERENCE = 2 * Math.PI * 24;
var myBets = [], myChips = 0, myTotalBet = 0, timerTotal = 30;
var toastTimeout = null, resultBannerTimeout = null;
var currentChipIndex = 0;

function getNumberColor(num) {
    if (num === 0 || num === '00') return 'green';
    if (RED_NUMBERS.includes(typeof num === 'string' ? parseInt(num) : num)) return 'red';
    return 'black';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── STATUS BANNER ──
function setBettingStatus(status) {
    var el = document.getElementById('status-banner');
    el.classList.remove('visible', 'betting', 'spinning');
    if (status === 'betting') {
        el.textContent = 'SE ACCEPTA PARIURI';
        el.classList.add('visible', 'betting');
    } else if (status === 'spinning') {
        el.textContent = 'BILA SE INVARTE';
        el.classList.add('visible', 'spinning');
    }
}

// ── CHIP SELECTOR ──
function setSelectedChip(amount, index, direction) {
    currentChipIndex = typeof index === 'number' ? index : CHIP_AMOUNTS.indexOf(amount);
    if (currentChipIndex < 0) currentChipIndex = 0;
    var items = document.querySelectorAll('.chip-sel-item');
    for (var i = 0; i < items.length; i++) {
        items[i].classList.remove('active', 'slide-left', 'slide-right');
        if (i === currentChipIndex) {
            items[i].classList.add('active');
            if (direction === 'left' || direction === 'right') {
                items[i].classList.add('slide-' + direction);
                // Remove animation class after it finishes so it can retrigger
                items[i].addEventListener('animationend', function handler() {
                    this.classList.remove('slide-left', 'slide-right');
                    this.removeEventListener('animationend', handler);
                });
            }
        }
    }
    document.getElementById('chip-selector').classList.add('visible');

    // Animate arrows on direction change
    if (direction === 'left' || direction === 'right') {
        var arrow = document.getElementById(direction === 'left' ? 'arrow-left' : 'arrow-right');
        if (arrow) {
            arrow.classList.remove('bounce-left', 'bounce-right');
            void arrow.offsetWidth; // force reflow to retrigger
            arrow.classList.add('bounce-' + direction);
            arrow.addEventListener('animationend', function h() {
                arrow.classList.remove('bounce-left', 'bounce-right');
                arrow.removeEventListener('animationend', h);
            });
        }
    }
}

// ── MY BETS ──
function updateMyBets(betsJson, chips, totalBet) {
    myBets = JSON.parse(betsJson); myChips = chips; myTotalBet = totalBet;
    document.getElementById('chips-value').textContent = '$' + chips.toLocaleString('en-US');
    document.getElementById('bet-value').textContent = '$' + totalBet.toLocaleString('en-US');
    renderBetsList();
}

function renderBetsList() {
    var list = document.getElementById('bets-list');
    var countEl = document.getElementById('bets-count');
    var totalEl = document.getElementById('bets-total');
    var panel = document.getElementById('my-bets-panel');

    totalEl.textContent = '$' + myTotalBet.toLocaleString('en-US');

    if (myBets.length === 0) {
        countEl.textContent = '0';
        list.innerHTML = '<div class="bets-empty">Niciun pariu plasat</div>';
        panel.classList.remove('visible');
        return;
    }

    // Stack bets by type+value
    var grouped = {};
    var groupOrder = [];
    for (var i = 0; i < myBets.length; i++) {
        var b = myBets[i];
        var key = b.type + ':' + String(b.value);
        if (!grouped[key]) {
            grouped[key] = { type: b.type, value: b.value, amount: 0, count: 0, numbers: b.numbers, payout: b.payout };
            groupOrder.push(key);
        }
        grouped[key].amount += b.amount;
        grouped[key].count++;
    }

    countEl.textContent = groupOrder.length;
    panel.classList.add('visible');
    list.innerHTML = '';
    var maxShow = 20;
    for (var gi = 0; gi < groupOrder.length && gi < maxShow; gi++) {
        var g = grouped[groupOrder[gi]];
        var label = '';
        if (g.type === 'straight') label = 'Nr ' + g.value;
        else if (g.type === 'column') label = '2:1 Row ' + g.value;
        else if (g.type === 'dozen') label = (g.value === 1 ? '1st' : g.value === 2 ? '2nd' : '3rd') + ' 12';
        else if (g.type === 'red') label = 'RED';
        else if (g.type === 'black') label = 'BLACK';
        else if (g.type === 'odd') label = 'ODD';
        else if (g.type === 'even') label = 'EVEN';
        else if (g.type === 'low') label = '1-18';
        else if (g.type === 'high') label = '19-36';
        else label = g.type || '';
        var dotClass = getBetDotClass(g);
        var row = document.createElement('div');
        row.className = 'bet-row';
        var countHtml = g.count > 1 ? '<span class="bet-count-badge">x' + g.count + '</span>' : '';
        row.innerHTML =
            '<div class="bet-zone">' +
                '<div class="bet-zone-dot ' + dotClass + '"></div>' +
                '<span class="bet-zone-name">' + esc(label) + countHtml + '</span>' +
            '</div>' +
            '<span class="bet-amount">$' + g.amount.toLocaleString('en-US') + '</span>';
        list.appendChild(row);
    }
    if (groupOrder.length > maxShow) {
        var extra = document.createElement('div');
        extra.className = 'bets-empty';
        extra.textContent = '+ inca ' + (groupOrder.length - maxShow) + ' pariu(ri)';
        list.appendChild(extra);
    }
}

function getBetDotClass(bet) {
    if (bet.type === 'straight') {
        var n = parseInt(bet.value);
        if (n === 0 || bet.value === '00') return 'green';
        if (RED_NUMBERS.includes(n)) return 'red';
        return 'black';
    }
    if (bet.type === 'red') return 'red';
    if (bet.type === 'black') return 'black';
    return 'mixed';
}

// ── CONFETTI ──
function spawnConfetti(count, color) {
    var c = document.getElementById('confetti-container'); c.innerHTML = '';
    var cols = color==='green'?['#27ae60','#2ecc71','#ff9a40','#fff']:
               color==='red'?['#e74c3c','#c0392b','#ff9a40','#fff']:['#ecf0f1','#bdc3c7','#ff9a40','#fff'];
    for (var i = 0; i < count; i++) {
        var el = document.createElement('div'); el.className = 'confetti';
        var sz = 4+Math.random()*8; el.style.width = sz+'px';
        el.style.height = (Math.random()>0.5?sz:sz*2.5)+'px';
        el.style.borderRadius = Math.random()>0.5?'50%':'2px';
        el.style.background = cols[Math.floor(Math.random()*cols.length)];
        el.style.left = (10+Math.random()*80)+'%'; el.style.top = '-10px';
        el.style.setProperty('--confetti-x',(Math.random()-0.5)*400+'px');
        el.style.setProperty('--confetti-r',Math.random()*720-360+'deg');
        el.style.animationDuration = (2+Math.random()*2.5)+'s';
        el.style.animationDelay = (Math.random()*0.6)+'s';
        c.appendChild(el);
    }
    setTimeout(function(){c.innerHTML='';},6000);
}
function spawnWinParticles() {
    var c = document.getElementById('confetti-container');
    for (var i = 0; i < 25; i++) {
        var el = document.createElement('div'); el.className = 'win-particle';
        var a = Math.random()*360, d = 60+Math.random()*250;
        el.style.setProperty('--px',Math.cos(a*Math.PI/180)*d+'px');
        el.style.setProperty('--py',Math.sin(a*Math.PI/180)*d+'px');
        el.style.left='50%'; el.style.top='50%';
        el.style.animationDelay = Math.random()*0.3+'s';
        c.appendChild(el);
    }
}

// ── STATE UPDATE ──
function updateGameState(stateJson) {
    var s = JSON.parse(stateJson);
    renderPlayerList(s.players||[]);
    renderHistory(s.history||[]);
}

// ── BETTING START ──
function onBettingStart(betTime) {
    timerTotal = betTime;
    document.getElementById('timer-wrap').classList.add('visible');
    document.getElementById('timer-label').textContent = 'Plasati pariurile';
    document.getElementById('timer-num').textContent = betTime;
    document.getElementById('result-banner').classList.remove('visible');
    setBettingStatus('betting');
    document.getElementById('chip-selector').classList.add('visible');
}

// ── BET TIMER ──
function updateBetTimer(timeLeft) {
    var wrap = document.getElementById('timer-wrap');
    var fillEl = document.getElementById('fill');
    var numEl = document.getElementById('timer-num');
    if (timeLeft <= 0) { wrap.classList.remove('visible'); return; }
    wrap.classList.add('visible');
    numEl.textContent = timeLeft;
    fillEl.style.strokeDasharray = CIRCUMFERENCE;
    var ratio = timeLeft / timerTotal;
    fillEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
    if (ratio < 0.2) fillEl.style.stroke = '#e74c3c';
    else if (ratio < 0.5) fillEl.style.stroke = '#ff6b00';
    else fillEl.style.stroke = '#ff6b00';
    if (timeLeft <= 5) document.getElementById('timer-label').textContent = 'Ultimele secunde!';
}

// ── SPIN START ──
function onSpinStart(winningNumber, winningColor, spinTime) {
    document.getElementById('timer-wrap').classList.remove('visible');
    document.getElementById('result-banner').classList.remove('visible');
    setBettingStatus('spinning');
    document.getElementById('chip-selector').classList.remove('visible');
}

// ── SHOW RESULT ──
function onShowResult(number, color, stateJson) {
    var state = JSON.parse(stateJson);
    var banner = document.getElementById('result-banner');
    var numEl = document.getElementById('result-number');
    numEl.className = color; numEl.textContent = number;
    var cn = color==='red'?'Rosu':color==='black'?'Negru':'Verde';
    document.getElementById('result-text').textContent = number + ' \u2014 ' + cn;

    var myWin = 0;
    myBets.forEach(function(bet) {
        if (bet.numbers && bet.numbers.includes(number))
            myWin += bet.amount + (bet.amount * bet.payout);
    });
    var winEl = document.getElementById('result-win');
    if (myWin > 0) {
        winEl.textContent = '+$' + myWin.toLocaleString('en-US');
        winEl.style.color = '#27ae60'; winEl.className = 'win-glow';
        spawnConfetti(80, color); spawnWinParticles();
    } else if (myTotalBet > 0) {
        winEl.textContent = '-$' + myTotalBet.toLocaleString('en-US');
        winEl.style.color = '#e74c3c'; winEl.className = '';
    } else { winEl.textContent = ''; winEl.className = ''; }

    document.getElementById('result-glow').className = 'glow-' + color;
    banner.classList.add('visible');
    clearTimeout(resultBannerTimeout);
    resultBannerTimeout = setTimeout(function(){ banner.classList.remove('visible'); }, 5000);
    setBettingStatus('');
    renderPlayerList(state.players||[]);
    renderHistory(state.history||[]);
    myBets = []; myTotalBet = 0;
    renderBetsList();
}

// ── PLAYER LIST ──
function renderPlayerList(players) {
    var c = document.getElementById('pl-rows'); c.innerHTML = '';
    players.forEach(function(p) {
        var r = document.createElement('div'); r.className = 'pl-row';
        r.innerHTML =
            '<div class="pl-avatar">' + esc(p.name.charAt(0).toUpperCase()) + '</div>' +
            '<div><div class="pl-name">' + esc(p.name) + '</div>' +
            '<div class="pl-chips">$' + p.chips.toLocaleString('en-US') +
            (p.totalBet>0 ? ' <span style="color:#ff6b00">bet $' + p.totalBet + '</span>' : '') +
            '</div></div>' +
            (p.lastWin>0 ? '<div class="pl-win">+$' + p.lastWin.toLocaleString('en-US') + '</div>' : '');
        c.appendChild(r);
    });
}

// ── HISTORY ──
function renderHistory(history) {
    var c = document.getElementById('history-items'); c.innerHTML = '';
    history.forEach(function(h, i) {
        var el = document.createElement('div');
        el.className = 'history-num ' + h.color; el.textContent = h.number;
        if (i === 0) el.classList.add('new-entry');
        c.appendChild(el);
    });
}

// ── TOAST ──
function showToast(msg, dur) {
    clearTimeout(toastTimeout);
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    toastTimeout = setTimeout(function(){ el.classList.remove('show'); }, dur||2500);
}

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
</script>
